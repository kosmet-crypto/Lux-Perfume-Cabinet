/* Scores every bottle with something left for a given day. wx is today's weather or null. */
/* mood: what you wore before when you felt that way; with little history, the kind of scent that fits it */
function moodCounts(mood) {
  const c = {};
  let n = 0;
  if (mood)
    S.wears.forEach(w => {
      if (w.mood === mood) {
        c[w.pid] = (c[w.pid] || 0) + 1;
        n++;
      }
    });
  return { c, n };
}
function rankPicks(day, wx, occ, mood) {
  const AW = allWears(),
    ss = season(day),
    d0 = sod(day),
    yk = dkey(d0 - DAY),
    dk = dkey(d0),
    MC = moodCounts(mood),
    ml = moodName(mood).toLowerCase();
  const t = wx ? Math.round(wx.max != null ? (wx.max + wx.temp) / 2 : wx.temp) : null,
    tb = t == null ? null : t < 12 ? 'cold' : t >= 24 ? 'hot' : 'mild';
  return owned()
    .filter(p => p.ml > 0)
    .map(p => {
      const R = [];
      let sc = 0;
      const add = (v, why) => {
        sc += v;
        if (why && v > 0) R.push([v, why]);
      };
      const k = famKind(p.fam),
        own = (p.seasons || []).length,
        se = seasonsFor(p),
        pr = +p.proj || 0;
      if (se.includes(ss)) add(own ? 2 : 1, own ? 'Made for ' + ss.toLowerCase() : 'Suits ' + ss.toLowerCase());
      else if (own) add(-1);
      if (mood) {
        const c = MC.c[p.id] || 0;
        if (MC.n >= 3 && c) add(2 + (c / MC.n) * 4, 'You often wear it when you feel ' + ml);
        else {
          const H = {
            relaxed: [pr <= 3 || k === 'mid', 'Soft and easy'],
            energetic: [k === 'fresh', 'Fresh and lively'],
            cozy: [k === 'warm', 'Warm and comforting'],
            confident: [pr >= 4, 'Has presence'],
            romantic: [k === 'warm' || /flor|musk|powd/.test(norm(p.fam)), 'Soft and sensual'],
            focused: [pr <= 3 && k !== 'warm', 'Quiet enough to focus']
          }[mood];
          if (H && H[0]) add(2.4, H[1] + ' for a ' + ml + ' day');
        }
      }
      if (tb === 'cold')
        add(
          k === 'warm' ? 2 : k === 'fresh' ? -1 : 0.4,
          k === 'warm' ? t + '° today, a warm and dense scent fits' : ''
        );
      else if (tb === 'hot')
        add(
          k === 'fresh' ? 2 : k === 'warm' ? -1.5 : 0.3,
          k === 'fresh' ? t + '° today, something fresh and light' : ''
        );
      else if (tb === 'mild') add(k === 'mid' ? 0.8 : 0.3, k === 'mid' ? t + '° today, easy weather for it' : '');
      if (occ === 'work') add(pr >= 4 ? -1.5 : k === 'warm' ? 0 : 0.8, pr && pr <= 3 ? 'Polite enough for work' : '');
      else if (occ === 'eve')
        add(
          (pr >= 4 ? 1.5 : 0) + (k === 'warm' ? 1 : 0),
          pr >= 4 || k === 'warm' ? 'Has presence for the evening' : ''
        );
      let lw = 0;
      AW.forEach(w => {
        if (w.pid === p.id && w.t < d0 && w.t > lw) lw = w.t;
      });
      const d = lw ? Math.round((d0 - sod(lw)) / DAY) : null;
      if (d == null) add(2.2, 'Not worn yet');

        add(
          Math.min(d, 30) / 10 + (d >= 60 ? 1.5 : 0),
          d >= 60
            ? 'Waiting on the shelf for ' + Math.round(d / 30) + ' months'
            : d >= 7
              ? 'Not worn for ' + d + ' days'
              : ''
        );
        if (dkey(lw) === yk) add(-2);
      }
      if (AW.some(w => w.pid === p.id && w.t >= d0 && w.t < d0 + DAY)) add(-3);
      const rot = S.settings.rot;
      if (rot && rot.wk === dkey(weekStart(day)) && rot.ids[(new Date(day).getDay() + 6) % 7] === p.id)
        add(1.6, 'On this week\u2019s rotation for today');
      add((p.rating || 0) * 0.35, p.rating >= 4 ? 'You gave it ' + p.rating + ' stars' : '');
      sc += (hash(dk + p.id) % 100) / 250;
      return {
        p,
        sc,
        d: d == null ? 60 : d,
        why: R.sort((a, b) => b[0] - a[0])
          .slice(0, 3)
          .map(x => x[1])

/* Each photo is matched to a bottle whose name is in the file name; the rest are picked by hand. */
let PH = [];
function photoMatch(fname) {
  const f = ' ' + norm(fname.replace(/\.[a-z0-9]+$/i, '')).replace(/[_\-.]+/g, ' ') + ' ';
  let best = null,
    bs = 0;
  S.perfumes.forEach(p => {
    const w = norm(p.name)
      .split(/\s+/)
      .filter(x => x.length > 1);
    if (!w.length || !w.every(x => f.includes(x))) return;
    const sc =
      w.length * 2 +
      norm(p.brand)
        .split(/\s+/)
        .filter(x => x.length > 1 && f.includes(x)).length -
      (PHOTOS[p.id] ? 1 : 0);
    if (sc > bs) {
      bs = sc;
      best = p;
    }
  });
  return best ? best.id : '';
}
async function startPhotoBatch(files) {

/* Price per ml of a decant and of the full bottle, and how long each lasts at your pace
   (about 10 sprays per ml). Starts from what Lux knows; every field can be changed. */
let CALC = null;
function calcFor(o, back) {
  const k = pkey(o.brand, o.name),
    pp = o.pid && byId(o.pid),
    M = S.perfumes.filter(q => pkey(q.brand, q.name) === k),
    e = LIB.find(x => x.k === k);
  const W = allWears().filter(w => {
      const q = wP(w);
      return pkey(q.brand, q.name) === k;
    }),
    recent = W.filter(w => w.t > Date.now() - 90 * DAY).length;
  /* a decant and the full bottle of the same fragrance can both be in the cabinet (or on the wishlist) */
  const dec =
      pp && pp.type === 'Decant'
        ? pp
        : M.filter(q => q.type === 'Decant').sort((a, b) => (+b.bought || b.created || 0) - (+a.bought || a.created || 0))[0],
    bottle =
      pp && pp.type !== 'Decant'
        ? pp
        : M.find(q => q.type !== 'Decant' && notOwn(q.shelf)) || M.find(q => q.type !== 'Decant') || null;
  return {
    name: o.name,
    brand: o.brand,
    back,
    dMl: dec ? dec.maxMl : '',
    dPrice: dec && +dec.price > 0 ? dec.price : '',
    bMl: bottle ? bottle.maxMl : (e && e.s) || 100,
    bPrice:
      bottle && notOwn(bottle.shelf) && +bottle.seen > 0
        ? bottle.seen
        : +o.price > 0
          ? o.price
          : bottle && +bottle.price > 0
            ? bottle.price
            : '',
    wpm: recent ? Math.max(1, Math.round(recent / 3)) : 4,
    spw: W.length ? Math.max(1, Math.round(W.reduce((a, w) => a + (+w.n || 0), 0) / W.length)) : 3
  };
}
function openCalc(o) {
  CALC = o;
  MODAL = 'calc';
  openModal(calcHtml());

function calcHtml() {
  const o = CALC,
    f = (id, l, v, st) =>
      `<div class="fg"><label for="${id}">${l}</label><input id="${id}" type="number" min="0" step="${st}" inputmode="decimal" data-in="calc" value="${v == null ? '' : esc(v)}"></div>`;
  return `<button class="x" data-act="close" aria-label="Close">\u00d7</button><h2>Decant or bottle?</h2><p class="muted" style="margin:4px 0 16px">${esc(o.name)}${o.brand ? ' \u00b7 ' + esc(o.brand) : ''}. Price per ml and how long each lasts at your pace.</p>
 <div class="g2">${f('c-dml', 'Decant or sample (ml)', o.dMl, 0.5)}${f('c-dp', 'Decant price (' + esc(cur()) + ')', o.dPrice, 0.5)}${f('c-bml', 'Full bottle (ml)', o.bMl, 1)}${f('c-bp', 'Bottle price (' + esc(cur()) + ')', o.bPrice, 0.5)}${f('c-wpm', 'Wears a month', o.wpm, 1)}${f('c-spw', 'Sprays a wear', o.spw, 1)}</div>
 <div class="calc-out" id="calcOut">${calcOut(o)}</div>
 <div class="foot">${o.back ? '<button class="btn ghost" data-act="calcBack">Back</button>' : ''}<button class="btn" data-act="close">Done</button></div>`;
}
function calcOut(o) {
  const dMl = +o.dMl || 0,
    dp = +o.dPrice || 0,
    bMl = +o.bMl || 0,
    bp = +o.bPrice || 0,
    mlM = ((+o.wpm || 0) * (+o.spw || 0)) / 10;
  const dpm = dp && dMl ? dp / dMl : 0,
    bpm = bp && bMl ? bp / bMl : 0,
    L = [];
  const dur = m =>
    m < 1
      ? Math.max(1, Math.round(m * 4.3)) + ' weeks'
      : m < 24
        ? Math.round(m) + ' months'
        : Math.round((m / 12) * 10) / 10 + ' years';
  if (dpm) L.push(`Decant: <b>${money(dpm, 1)}</b> per ml${mlM ? ', lasts about ' + dur(dMl / mlM) : ''}`);
  if (bpm) L.push(`Bottle: <b>${money(bpm, 1)}</b> per ml${mlM ? ', lasts about ' + dur(bMl / mlM) : ''}`);
  if (dpm && bpm) {
    L.push(
      bpm < dpm
        ? `Per ml the bottle is <b>${Math.round((1 - bpm / dpm) * 100)}% cheaper</b>. ${fmt(bMl)} ml in decants would cost ${money(dpm * bMl)}.`
        : 'Per ml the decant is as cheap as the bottle or cheaper.'
    );
    if (mlM && bpm < dpm)
      L.push(
        bMl / mlM > 36
          ? `At this pace the bottle lasts over ${Math.floor(bMl / mlM / 12)} years. A decant may be all you need.`
          : `You would use the bottle up in about ${dur(bMl / mlM)}, so it pays off.`
      );
  }
  if (!L.length) L.push('Add a price and a size to compare.');
  return L.map(x => `<div>${x}</div>`).join('');
}

/* ================= daily reminders (Android app) ================= */
let remT;
function syncReminders() {
  if (!window.LuxAndroid || !LuxAndroid.setReminders) return;
  clearTimeout(remT);
  remT = setTimeout(() => {
    try {
      const r = S.settings.rem,
        picks = {},
        now = Date.now();
      for (let i = 0; i < 8; i++) {
        const day = now + i * DAY,
          q = rankPicks(day, i === 0 ? wxFresh() : null, 'day')[0];
        if (q)
          picks[dkey(day)] = {
            t: q.p.name,
            b: [q.p.brand].concat(q.why).join(' · '),
            id: q.p.id,
            br: q.p.brand,
            why: q.why[0] || '',
            n: Math.max(1, Math.round(wearCost(q.p).avg))
          };
      }
      const worn = [
        ...new Set(
          allWears()
            .filter(w => w.t > now - 3 * DAY)
            .map(w => dkey(w.t))
        )
      ];
      /* test check-ins: 2 and 6 hours after spraying, while the test is still open */
      const tests = [];
      if (r.test)
        ((S.tt && S.tt.sessions) || []).forEach(x => {
          if (x.status === 'done' || x.fadedAt) return;
          [2, 6].forEach(h => {
            const at = x.t0 + h * 36e5;
            if (at > now + 6e4 && at < now + 12 * 36e5)
              tests.push({
                id: x.id + '-' + h,
                at,
                t: 'How does ' + x.name + ' smell now?',
                b: h + ' hours after spraying. Tap to add an impression.'
              });
          });
        });
      tests.sort((a, b) => a.at - b.at);
      LuxAndroid.setReminders(
        JSON.stringify({
          am: !!r.am,
          amT: r.amT,
          pm: !!r.pm,
          pmT: r.pmT,
          picks,
          worn,
          tests: tests.slice(0, 6),
          widget: widgetData()
        })
      );
      rankPicks(now, wxFresh(), S.settings.occ || 'day', moodToday())
        .slice(0, 5)
        .forEach(q => sendWidgetImage(q.p));
    } catch (e) {}
  }, 600);
}
/* The widgets show today's pick as a picture (the bottle's photo, else the drawn bottle), sent to the
   app only when the pick or its photo changes. */
const widgetImgKey = {};
async function sendWidgetImage(p) {
  if (!window.LuxAndroid || !LuxAndroid.setWidgetImage) return;
  const key = p.id + ':' + (PHOTOS[p.id] ? PHOTOS[p.id].length : 0) + ':' + Math.round((p.ml / (p.maxMl || 1)) * 20);
  if (widgetImgKey[p.id] === key) return;
  widgetImgKey[p.id] = key;
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d'),
    im = await bottleImg(p, p.maxMl ? p.ml / p.maxMl : 1);
  if (!im) return;
  if (PHOTOS[p.id]) {
    // a photo fills a rounded square
    const k = Math.max(256 / im.width, 256 / im.height);
    x.beginPath();
    x.roundRect(0, 0, 256, 256, 28);
    x.clip();
    x.drawImage(im, (256 - im.width * k) / 2, (256 - im.height * k) / 2, im.width * k, im.height * k);
  } else drawIn(x, im, 128, 8, 240, 240);
  try {
    LuxAndroid.setWidgetImage(p.id, c.toDataURL('image/png').split(',')[1]);
  } catch (e) {}
}

/* A bottle as an image for canvases: its photo, else the drawn bottle (glass lines dark on light pictures). */
function bottleImg(p, level, light) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);
    if (PHOTOS[p.id]) {
      im.src = PHOTOS[p.id];
      return;
    }
    const defs =
      '<defs>' +
      ['g-cap', 'g-shade']
        .map(id => {
          const e = document.getElementById(id);
          return e ? e.outerHTML : '';
        })
        .join('') +
      '</defs>';
    const s = bottle(p, level)
      .replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="320" ')
      .replace(/(<svg[^>]*>)/, '$1' + defs)
      .replace('class="gl"', light ? 'fill="rgba(0,0,0,.04)" stroke="rgba(40,30,10,.4)"' : 'fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.34)"')
      .replace('class="sh"', light ? 'fill="rgba(255,255,255,.5)"' : 'fill="rgba(255,255,255,.16)"');
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  });
}
function ell(x, t, w) {
  t = String(t || '');
  if (x.measureText(t).width <= w) return t;
  while (t.length > 1 && x.measureText(t + '…').width > w) t = t.slice(0, -1);
  return t.trim() + '…';
}
function drawIn(x, im, cx, top, w, h) {
  if (!im) return;
  const k = Math.min(w / im.width, h / im.height),
    dw = im.width * k,
    dh = im.height * k;
  x.drawImage(im, cx - dw / 2, top + h - dh, dw, dh);
}

/* Test lab results: best first, as a picture (Share), as text for a chat and as CSV. */
function testedList() {

}
/* Seasons of a tested fragrance: the temperature band where your tests scored best, else a guess
   from the family and notes. */
function testSeason(g) {
  const T = window.LuxTT && LuxTT.season;
  const r = T ? T(g) : null;
  if (r) return r;
  const p = g.pid && byId(g.pid),
    se = p ? seasonsFor(p) : seasonGuess(g.fam, pyrAll(pyrOf(g.brand, g.name)));
  return se.join(' & ');
}
function testP(g) {
  return (g.pid && byId(g.pid)) || { id: 'g' + g.key, name: g.name, brand: g.brand, fam: g.fam, shelf: 'wish' };
}
function testsText() {
  const f = v => (v == null ? '\u2014' : String(Math.round(v * 10) / 10)),
    G = testedList();
  const L = [
    'Lux Test lab results, ' +
      new Date().toLocaleDateString(I18N.loc, { day: 'numeric', month: 'long', year: 'numeric' }),
    'Scores out of 10, best first.',
    ''
  ];
  G.forEach((g, i) => {
    const p = g.pid && byId(g.pid),
      b = [
        f(g.avg) + '/10',
        'longevity ' + f(g.crit.longevity),
        'sillage ' + f(g.crit.sillage),
        'skin ' + f(g.crit.skin)
      ];
    if (g.crit.value != null) b.push('value ' + f(g.crit.value));
    b.push(g.done.length + (g.done.length === 1 ? ' test' : ' tests'));
    if (g.hours != null) b.push('lasted about ' + f(g.hours) + ' h');
    if (g.buy) b.push('would buy: ' + g.buy);
    if (+g.price > 0) b.push('price ' + money(g.price));
    if (p) b.push(notOwn(p.shelf) ? 'on wishlist' : 'owned');
    const se = testSeason(g);
    if (se) b.push('season: ' + se.toLowerCase());
    const ny = pyrAll(pyrOf(g.brand, g.name));
    if (ny.length) b.push('notes: ' + ny.join(', '));
    L.push(i + 1 + '. ' + g.brand + ' \u2013 ' + g.name + (g.fam ? ' (' + g.fam + ')' : '') + ': ' + b.join(', '));
    const rv = g.done.find(s => s.comment);
    if (rv) L.push('   \u201c' + rv.comment.replace(/\s+/g, ' ').trim() + '\u201d');
  });

}
async function copyText(txt, done) {
  let ok = false;
  try {
    await navigator.clipboard.writeText(txt);
    ok = true;
  } catch (e) {}
  if (!ok) {
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      ok = document.execCommand('copy');
    } catch (e) {}
    ta.remove();
  }
  toast(ok ? done : 'Copying is blocked here');
}
async function shareGo(saveOnly) {
  if (!SHR.url) {
    toast('One moment, still drawing');
    return;
  }
  const name = 'lux-' + SHR.kind + '-' + dkey(Date.now()) + '.png',
    b64 = SHR.url.split(',')[1];
  if (window.LuxAndroid && LuxAndroid.shareImage) {
    if (saveOnly) LuxAndroid.saveImage(name, b64);
    else LuxAndroid.shareImage(b64);
    return;
  }
  const blob = await (await fetch(SHR.url)).blob(),
    file = new File([blob], name, { type: 'image/png' });
  if (!saveOnly && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'My Lux cabinet' });
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast(saveOnly ? 'Image saved' : 'Sharing is not available here, so the image was downloaded');
  } catch (e) {
    toast('Could not save the image here');
  }
}

    $('#calcOut').innerHTML = calcOut(CALC);
  },
  pyrPaste: e => {
    const y = parseNotes(e.value);
    if (!pyrAll(y).length) return;
    [
      ['py-top', 'top'],
      ['py-mid', 'mid'],
      ['py-base', 'base']
    ].forEach(([id, k]) => {
      const i = $('#' + id);
      if (i) i.value = y[k].join(', ');
    });
  },
  cityQ: e => {
    clearTimeout(cityT);
    const q = e.value.trim();
    cityT = setTimeout(() => cityFind(q), 350);
  },
  mlr: e => {
    const f = $('#f-ml');
    f.value = e.value;
    readSheet();
    refreshBt();
  }
};
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in;
  if (k && IN[k]) IN[k](e.target, e);
});
const CH = {
  insM: e => {
    S.settings.ins.m = e.value;
    save();
    updateIns();
  },
  insPP: e => {
    S.settings.ins.p = e.value;
    save();
    updateIns();
  },
  insG: e => {
    S.settings.ins.g = e.value;
    save();
    updateIns();
  },
  cpw: e => {
    ui.cpw = e.value;
    render();
  },
  rank: e => {
    ui.rank = e.value;
    const d = insCompute();
    $('#rankBox').innerHTML = rankHtml(d);
  },
  lf: e => {
    ui.lf = e.value;
    ui.llim = 60;
    updateLib();
  },
  lc: e => {
    ui.lc = e.value;
    ui.llim = 60;
    updateLib();
  },
  spm: e => {
    S.settings.spm = e.value === '' ? 0 : clamp(+e.value || 0, 1, 40);
    save();
    toast('Saved');
  },
  lang: e => {
    S.settings.lang = e.value;
    persist();
    location.reload();
  },
  cur: e => {
    S.settings.cur = e.value.trim();
    save();
    toast('Saved');
  },
  shName: e => {
    const s = S.shelves.find(x => x.id === e.dataset.id);
    if (s) {
      s.name = e.value.trim() || s.name;
      save();
      toast('Shelf renamed');
    }
  },
  remT: e => {
    if (e.value) {
      S.settings.rem[e.dataset.k] = e.value;
      save();
      toast('Saved');
    }
  },
  mood: e => {
    S.settings.mood = { d: dkey(Date.now()), m: e.value };
    ui.pick = 0;
    ui.pickWhy = false;
    save();
    render();
  },
  wp: e => {
    WD.pid = e.value;
    if (WD.layer) {
      if (WD.pid2 === WD.pid) WD.pid2 = (owned().find(p => p.id !== WD.pid) || {}).id;
      $('#modal .panel').innerHTML = wearHtml();
    }
  },
  wp2: e => {
    WD.pid2 = e.value;
  },
  wd: e => {
    WD.date = e.value || dkey(Date.now());
  },
  impMap: e => {
    const f = e.dataset.f;
    IMP.map[f] = e.value === 'combo' ? 'combo' : parseInt(e.value, 10);
    const { rows, map } = IMP;
    $('#imp-pv').innerHTML = rows
      .slice(0, 3)
      .map(
        r =>
          `${esc(map.name >= 0 ? r[map.name] : '?')}${map.brand >= 0 ? ' <span class="muted">\u00b7 ' + esc(r[map.brand]) + '</span>' : ''}`
      )
      .join('<br>');
  }
};
document.addEventListener('change', async e => {
  const t = e.target,
    k = t.dataset && t.dataset.ch;
  if (k && CH[k]) {
    CH[k](t, e);
    return;
  }
  if (t.id === 'photoFile' && t.files[0] && D) {
    try {
      readSheet();
      const url = await compressImage(t.files[0]);
      PHOTOS[D.id] = url;
      await idb.set('photo:' + D.id, url);
      paintSheet();
    } catch (err) {
      toast('That image could not be read');
    }
  } else if (t.id === 'photoMany' && t.files.length) {
    const fs = [...t.files];
    t.value = '';
    startPhotoBatch(fs);
  } else if (t.id === 'impFile' && t.files[0]) {
    const f = t.files[0];
    const txt = await f.text();
    t.value = '';
    startImport(txt, f.name);
  } else if (t.id === 'bkFile' && t.files[0]) {
    const f = t.files[0];
    const txt = await f.text();
    t.value = '';
    restoreText(txt);
  }
});

/* ================= init ================= */
(async function init() {
  parseRaw();
  if (!S) {
    S = seed();
    persist();
  } /* before the first await, so lux-test.js never sees S as null */
  await idb.open();
  await loadPhotos();
  await loadImported();
  buildLib();
  applyTheme();
  I18N.set(I18N.pick(S.settings.lang));
  if (I18N.lang !== 'en') MON.forEach((m, i) => (MON[i] = I18N.tr(m)));
  $('#fam-list').innerHTML = FAMLIST.map(f => `<option value="${f}">`).join('');
  render();
  if (S.demo && !S.settings.introSeen && $('#modal').hidden) openIntro();
  takePending();
  syncReminders();
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) takePending();
  });
  window.addEventListener('beforeunload', () => {
    try {
      persist();
    } catch (e) {}
  });
})();
/* ================= chart hover and tap ================= */
document.addEventListener('mouseover', e => {
  const t = e.target.closest && e.target.closest('.seg,.lg-row');
  if (t && $('#dn')) hl(+t.dataset.i);
});
document.addEventListener('mouseout', e => {
  const t = e.target.closest && e.target.closest('.seg,.lg-row');
  if (t && $('#dn')) hl(null);
});
document.addEventListener('click', e => {
  if (!$('#dn')) return;
  const t = e.target.closest('.seg,.lg-row');
  if (t) hl(+t.dataset.i);
  else if (!e.target.closest('.donut-wrap')) hl(null);
});
</script>

<script>
/* Manual update check. Android app: the native side asks GitHub Releases and shows the result itself.
   Web/PWA: compare the files the service worker cached with the ones on the server. */
async function checkForUpdate() {
  if (window.LuxAndroid && LuxAndroid.checkForUpdate) {
    LuxAndroid.checkForUpdate();
    return;
  }
  toast('Checking for updates\u2026');
  try {
    let changed = false;
    for (const f of ['index.html', 'lux-test.js']) {
      // Unique URL + no-store so neither the service worker nor the HTTP cache answers.
      const res = await fetch(f + '?check=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const copy = res.clone(),
        fresh = await res.text(),
        cached = window.caches ? await caches.match('./' + f) : null;
      if (cached && (await cached.text()) !== fresh) {
        changed = true;
        // lux-test.js is served cache-first, so store the new copy before reloading.
        for (const k of await caches.keys()) await (await caches.open(k)).put('./' + f, copy.clone());
      }
    }
    const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null;
    if (reg) reg.update().catch(() => {});
    if (changed) {
      toast('New version found. Updating\u2026');
      setTimeout(() => location.reload(), 900);
    } else toast('You have the latest version');
  } catch (e) {
    toast('Could not check. Are you online?');
  }
}
/* Offline support when installed from the web; the Android app bundles its files instead. */
if ('serviceWorker' in navigator && location.protocol !== 'file:' && !window.LuxAndroid) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
