<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lux · Perfume Cabinet</title>
<meta name="theme-color" content="#161a18">
<!-- Android bridge this page needs; the app only takes silent content updates it supports (android/.../Ota.java). -->
<meta name="lux-native" content="3">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  /* dark theme: softer than pure white on black, with a calmer, deeper gold, to rest the eyes */
  --bg: #181a19;
  --bg2: #1e2120;
  --surf: #242827;
  --surf2: #2c302e;
  --line: rgba(232, 220, 190, 0.12);
  --line2: rgba(232, 220, 190, 0.24);
  --tx: #e6e0d2;
  --tx2: #c2bcae;
  --tx3: #9f998a;
  --gold: #c8a96e;
  --gold2: #ddc595;
  --goldink: #19130a;
  --glow: rgba(200, 169, 110, 0.13);
  --danger: #d4705f;
  --ledge: rgba(190, 158, 100, 0.32);
  --scrim: rgba(6, 7, 6, 0.66);
  --glass: rgba(255, 255, 255, 0.04);
  --gf: rgba(255, 255, 255, 0.07);
  --gs: rgba(255, 255, 255, 0.4);
  --shn: rgba(255, 255, 255, 0.18);
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
/* accent colour (Settings): gold is the default; rose gold and silver swap the accent tokens in both themes */
:root[data-accent='rose'] {
  --gold: #e2a894;
  --gold2: #f2c9ba;
  --glow: rgba(226, 168, 148, 0.14);
  --ledge: rgba(214, 150, 130, 0.34);
}
:root[data-accent='silver'] {
  --gold: #c4c9cf;
  --gold2: #e6e9ec;
  --glow: rgba(196, 201, 207, 0.12);
  --ledge: rgba(190, 195, 200, 0.3);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    --bg: #e6e0d3;
    --bg2: #ddd6c7;
    --surf: #ece6d9;
    --surf2: #e3dccd;
    --line: rgba(44, 36, 20, 0.14);
    --line2: rgba(44, 36, 20, 0.27);
    --tx: #14110c;
    --tx2: #3e382d;
    --tx3: #5f584a;
    --gold: #6f4f15;
    --gold2: #573c0c;
    --goldink: #fff8e8;
    --glow: rgba(111, 79, 21, 0.12);
    --danger: #9c3324;
    --ledge: rgba(143, 107, 40, 0.4);
    --scrim: rgba(30, 24, 12, 0.45);
    --glass: rgba(0, 0, 0, 0.03);
    --gf: rgba(0, 0, 0, 0.05);
    --gs: rgba(40, 30, 10, 0.45);
    --shn: rgba(255, 255, 255, 0.55);
  }
}
:root[data-theme='light'] {
  --bg: #e6e0d3;
  --bg2: #ddd6c7;
  --surf: #ece6d9;
  --surf2: #e3dccd;
  --line: rgba(44, 36, 20, 0.14);
  --line2: rgba(44, 36, 20, 0.27);
  --tx: #14110c;
  --tx2: #3e382d;
  --tx3: #5f584a;
  --gold: #6f4f15;
  --gold2: #573c0c;
  --goldink: #fff8e8;
  --glow: rgba(111, 79, 21, 0.12);
  --danger: #9c3324;
  --ledge: rgba(143, 107, 40, 0.4);
  --scrim: rgba(30, 24, 12, 0.45);
  --glass: rgba(0, 0, 0, 0.03);
  --gf: rgba(0, 0, 0, 0.05);
  --gs: rgba(40, 30, 10, 0.45);
  --shn: rgba(255, 255, 255, 0.55);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark'])[data-accent='rose'] {
    --gold: #8e4a3a;
    --gold2: #733526;
    --glow: rgba(142, 74, 58, 0.12);
    --ledge: rgba(142, 74, 58, 0.35);
  }
  :root:not([data-theme='dark'])[data-accent='silver'] {
    --gold: #4f5660;
    --gold2: #3a4048;
    --glow: rgba(79, 86, 96, 0.12);
    --ledge: rgba(79, 86, 96, 0.35);
  }
}
:root[data-theme='light'][data-accent='rose'] {
  --gold: #8e4a3a;
  --gold2: #733526;
  --glow: rgba(142, 74, 58, 0.12);
  --ledge: rgba(142, 74, 58, 0.35);
}
:root[data-theme='light'][data-accent='silver'] {
  --gold: #4f5660;
  --gold2: #3a4048;
  --glow: rgba(79, 86, 96, 0.12);
  --ledge: rgba(79, 86, 96, 0.35);
}
html {
  -webkit-text-size-adjust: 100%;
  scroll-padding-top: env(safe-area-inset-top, 0px);
  background: var(--bg);
}
html.lock {
  overflow: hidden;
}
body {
  font: 15px/1.5 var(--sans);
  color: var(--tx);
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
  background: radial-gradient(900px 520px at 78% -8%, var(--glow), transparent 65%), var(--bg);
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  background: none;
  border: 0;
}
:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
h1 {
  font: 500 44px/1.02 var(--serif);
  letter-spacing: 0.005em;
}
h2 {
  font: 500 26px/1.1 var(--serif);
}
h3 {
  font: 600 20px/1.15 var(--serif);
}
.app {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  min-height: 100vh;
}
.rail {
  position: sticky;
  top: 0;
  align-self: start;
  height: 100vh;
  padding: 38px 20px 26px;
  display: flex;
  flex-direction: column;
  gap: 34px;
  border-right: 1px solid var(--line);
}
.mark {
  font: italic 500 50px/1 var(--serif);
  color: var(--gold2);
  letter-spacing: 0.01em;
}
.msub {
  color: var(--tx3);
  font-size: 13px;
  margin-top: 6px;
}
.nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.nb {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 11px 14px;
  border-radius: 14px;
  color: var(--tx2);
  text-align: left;
  transition:
    background 0.2s,
    color 0.2s;
}
.nb svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.nb:hover {
  color: var(--tx);
  background: var(--glass);
}
.nb.on {
  color: var(--gold2);
  background: var(--surf);
}
.rail-foot {
  margin-top: auto;
  color: var(--tx3);
  font-size: 12.5px;
  line-height: 1.5;
}
#view {
  padding: 44px 48px 90px;
  max-width: 1120px;
  width: 100%;
}
.vh {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 18px;
  flex-wrap: wrap;
  margin-bottom: 30px;
}
.sub2 {
  color: var(--tx2);
  margin-top: 10px;
}
.acts {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn {
  background: var(--gold);
  color: var(--goldink);
  border-radius: 999px;
  padding: 11px 22px;
  font-weight: 600;
  font-size: 14px;
  transition:
    transform 0.2s,
    filter 0.2s;
}
a.btn {
  display: inline-block;
  text-decoration: none;
}
.hint a {
  color: var(--gold);
}
.btn:hover {
  filter: brightness(1.08);
  transform: translateY(-1px);
}
.btn.ghost {
  background: transparent;
  color: var(--tx);
  border: 1px solid var(--line2);
}
.btn.ghost:hover {
  border-color: var(--gold);
  color: var(--gold2);
}
.btn.danger {
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--line2);
}
.btn.sm {
  padding: 7px 15px;
  font-size: 13px;
}
.note {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  padding: 14px 18px;
  margin-bottom: 26px;
  border: 1px solid var(--line2);
  border-radius: 16px;
  background: var(--surf);
  color: var(--tx2);
  font-size: 14px;
}
.card {
  background: var(--surf);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 26px;
}
.card + .card {
  margin-top: 18px;
}
.muted {
  color: var(--tx3);
}
/* shelves */
.shelf {
  margin-bottom: 38px;
}
.shelf-h {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.shelf-h span {
  color: var(--tx3);
  font-size: 13px;
}
.rack {
  --rowh: 262px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  grid-auto-rows: var(--rowh);
  min-height: var(--rowh);
  background-image: linear-gradient(to bottom, transparent calc(100% - 2px), var(--ledge) calc(100% - 2px));
  background-size: 100% var(--rowh);
  border-radius: 6px;
  transition: background-color 0.2s;
}
.rack.over {
  background-color: var(--glow);
  box-shadow: 0 0 0 1px var(--gold) inset;
}
.wish .rack {
  background-image: linear-gradient(to bottom, transparent calc(100% - 1px), var(--line2) calc(100% - 1px));
}
.wish .bt {
  opacity: 0.72;
}
/* wishlist tiles carry up to three extra lines (stars, price seen, target), so their rows are taller */
.wish .rack {
  --rowh: 300px;
}
.empty {
  grid-column: 1/-1;
  align-self: center;
  padding: 0 10px;
  color: var(--tx3);
  max-width: 420px;
}
.it {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 8px 14px;
  cursor: pointer;
  min-width: 0;
  border-radius: 14px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.it img {
  -webkit-user-drag: none;
}
.it:hover .bt {
  transform: translateY(-7px);
}
.it.dragging {
  opacity: 0.22;
}
.it.drop-l::before,
.it.drop-r::after {
  content: '';
  position: absolute;
  top: 16px;
  bottom: 22px;
  width: 2px;
  background: var(--gold);
  border-radius: 2px;
}
.it.drop-l::before {
  left: 0;
}
.it.drop-r::after {
  right: 0;
}
.bt {
  position: relative;
  width: 88px;
  height: 141px;
  margin-top: 8px;
  transition: transform 0.32s cubic-bezier(0.2, 0.7, 0.2, 1);
  filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.3));
}
.bsv {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}
.bsv .gl {
  fill: var(--gf);
  stroke: var(--gs);
}
.bsv .sh {
  fill: var(--shn);
}
.bt img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 8px;
  opacity: 0;
}
.bt.has-img img {
  opacity: 1;
}
.bt.has-img .bsv {
  opacity: 0;
}
.gauge {
  display: none;
  position: absolute;
  right: -8px;
  top: 8px;
  bottom: 8px;
  width: 3px;
  background: var(--line2);
  border-radius: 3px;
  overflow: hidden;
}
.gauge b {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--gold);
}
.has-img .gauge {
  display: block;
}
.nm {
  flex-shrink: 0;
  font: 600 18px/1.12 var(--serif);
  margin-top: 12px;
  text-align: center;
  max-width: 100%;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  word-break: break-word;
}
.br {
  flex-shrink: 0;
  font-size: 12px;
  color: var(--tx3);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.lv {
  font-size: 11.5px;
  color: var(--tx2);
  margin-top: 3px;
  white-space: nowrap;
}
.lv.wl {
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.4;
  max-width: 100%;
}
.lv.wl > span {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ghost-el {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 300;
  pointer-events: none;
  width: 90px;
  filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.5));
}
body.dragging-on {
  cursor: grabbing;
  -webkit-user-select: none;
  user-select: none;
}
/* forms */
input,
select,
textarea {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--line2);
  color: var(--tx);
  border-radius: 12px;
  padding: 11px 13px;
  font: inherit;
  outline: none;
  transition: border-color 0.2s;
}
input:focus,
select:focus,
textarea:focus {
  border-color: var(--gold);
}
input[type='range'] {
  padding: 0;
  height: 26px;
  accent-color: var(--gold);
  background: none;
  border: 0;
}
input[type='file'] {
  display: none;
}
textarea {
  resize: vertical;
  min-height: 84px;
}
label,
.lb {
  display: block;
  font-size: 12.5px;
  color: var(--tx2);
  margin-bottom: 6px;
}
.fg {
  margin-bottom: 14px;
  position: relative;
  min-width: 0;
}
.g2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 14px;
}
.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chip {
  padding: 7px 15px;
  border-radius: 999px;
  border: 1px solid var(--line2);
  color: var(--tx2);
  font-size: 13.5px;
  transition: all 0.2s;
}
.chip:hover {
  border-color: var(--gold);
}
.chip.on {
  background: var(--gold);
  color: var(--goldink);
  border-color: var(--gold);
  font-weight: 600;
}
.stars {
  display: flex;
  gap: 2px;
}
.stars button {
  font-size: 24px;
  line-height: 1;
  color: var(--line2);
  padding: 2px 3px;
}
.stars button.on {
  color: var(--gold);
}
.stars.dots button {
  font-size: 15px;
}
.sugg {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  z-index: 20;
  margin-top: 4px;
  background: var(--surf2);
  border: 1px solid var(--line2);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
}
.sugg:empty {
  display: none;
}
.sugg button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.sugg button:last-child {
  border: 0;
}
.sugg button:hover {
  background: var(--glass);
  color: var(--gold2);
}
.sugg small {
  color: var(--tx3);
}
/* modal */
.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: var(--scrim);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.modal[hidden] {
  display: none;
}
.modal.dlg {
  z-index: 200;
  align-items: center;
  padding: 20px;
}
.panel {
  position: relative;
  width: min(640px, 100%);
  max-height: 92dvh;
  max-height: 92vh;
  overflow: auto;
  background: var(--surf);
  border: 1px solid var(--line2);
  border-radius: 26px 26px 0 0;
  padding: 28px 26px calc(24px + env(safe-area-inset-bottom, 0px));
  animation: up 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.dlg .panel {
  width: min(420px, 100%);
  border-radius: 24px;
  padding: 26px;
}
@keyframes up {
  from {
    transform: translateY(28px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
.x {
  position: absolute;
  right: 16px;
  top: 14px;
  font-size: 26px;
  color: var(--tx3);
  width: 36px;
  height: 36px;
  border-radius: 50%;
}
.x:hover {
  color: var(--tx);
  background: var(--glass);
}
.s-top {
  display: flex;
  gap: 22px;
  align-items: flex-start;
  margin-bottom: 20px;
  padding-right: 26px;
}
.s-bt {
  flex: none;
  width: 96px;
}
.s-bt .bt {
  width: 96px;
  height: 154px;
  margin: 0;
}
.s-id {
  flex: 1;
  min-width: 0;
}
.s-id input {
  font: 600 22px var(--serif);
}
.s-stats {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  color: var(--tx2);
  font-size: 13px;
  margin-top: 4px;
}
.s-stats b {
  color: var(--tx);
  font-weight: 600;
}
.foot {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 22px;
  flex-wrap: wrap;
}
.foot .sp {
  margin-right: auto;
}
.stepper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 26px;
  margin: 18px 0 22px;
}
.stepper button {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 1px solid var(--line2);
  font-size: 24px;
  color: var(--gold2);
}
.stepper button:hover {
  border-color: var(--gold);
}
.stepper b {
  font: 500 54px/1 var(--serif);
  min-width: 64px;
  text-align: center;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 16px);
  background: var(--tx);
  color: var(--bg);
  padding: 11px 20px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  z-index: 400;
  max-width: 90vw;
  text-align: center;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
/* insights */
.kpis {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--surf);
  margin-bottom: 18px;
}
.kpi {
  padding: 22px 22px;
  border-left: 1px solid var(--line);
}
.kpi:first-child {
  border: 0;
}
.kpi b {
  display: block;
  font: 500 34px/1.05 var(--serif);
  color: var(--gold2);
}
.kpi span {
  font-size: 12.5px;
  color: var(--tx3);
}
.ctl {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: flex-end;
  margin-bottom: 22px;
}
.ctl .fg {
  margin: 0;
  flex: 1 1 140px;
  min-width: 0;
}
.donut-wrap {
  display: grid;
  grid-template-columns: 270px 1fr;
  gap: 34px;
  align-items: center;
}
.dn {
  position: relative;
  width: 270px;
  height: 270px;
}
.dn svg {
  width: 100%;
  height: 100%;
  display: block;
}
.seg {
  transition:
    stroke-dasharray 0.95s cubic-bezier(0.2, 0.7, 0.2, 1),
    opacity 0.2s;
  cursor: pointer;
}
.dn.hl .seg {
  opacity: 0.25;
}
.dn.hl .seg.on {
  opacity: 1;
}
.dc {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 64px;
  pointer-events: none;
}
.dc b {
  font: 500 34px/1.05 var(--serif);
}
.dc span {
  font-size: 12.5px;
  color: var(--tx3);
  max-width: 100%;
  overflow: hidden;

.pick .acts {
  margin-top: 14px;
}
select.mini {
  width: auto;
  padding: 5px 8px;
  border-radius: 999px;
  font-size: 12.5px;
  background: var(--bg2);
}
/* stats: strips, bars and note scores */
.hrow {
  display: grid;
  grid-template-columns: minmax(0, 34%) 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 9px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.hrow .nmx {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hrow .nmx small {
  display: block;
  color: var(--tx3);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.hrow .v {
  color: var(--tx2);
  font-size: 13px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.htrack {
  position: relative;
  height: 10px;
  border-radius: 99px;
  background: var(--line);
}
.htrack b {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  border-radius: 99px;
  background: var(--gold);
}
.htrack i {
  position: absolute;
  top: 50%;
  width: 9px;
  height: 9px;
  margin: -4.5px 0 0 -4.5px;
  border-radius: 50%;
  background: var(--gold);
  border: 1.5px solid var(--surf);
}
.htrack em {
  position: absolute;
  top: 2px;
  bottom: 2px;
  border-radius: 99px;
  background: var(--gold);
  opacity: 0.35;
}
.hax {
  display: grid;
  grid-template-columns: minmax(0, 34%) 1fr auto;
  gap: 12px;
  color: var(--tx3);
  font-size: 11.5px;
  margin-top: 6px;
}
.hax div {
  display: flex;
  justify-content: space-between;
}
/* test compare, notes pyramid, photo import */
.cmp {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  margin-top: 8px;
}
.cmp th,
.cmp td {
  padding: 9px 6px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}
.cmp th {
  color: var(--tx3);
  font-weight: 500;
  font-size: 12.5px;
  width: 28%;
}
.cmp td.win {
  color: var(--gold2);
  font-weight: 600;
}
.cmp-key {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 12.5px;
  color: var(--tx2);
  justify-content: center;
}
.cmp-key i {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-right: 6px;
  vertical-align: -1px;
}
.pyr {
  display: grid;
  gap: 6px;
  font-size: 13.5px;
  color: var(--tx2);
}
.pyr b {
  color: var(--tx3);
  font-weight: 500;
  font-size: 11.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-right: 8px;
}
.phrow {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.phrow img {
  width: 52px;
  height: 68px;
  object-fit: cover;
  border-radius: 8px;
  flex: none;
  background: var(--bg2);
}
.phrow select {
  flex: 1;
  min-width: 0;
}
.calc-out {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 14px;
  color: var(--tx2);
  display: grid;
  gap: 6px;
}
.calc-out b {
  color: var(--tx);
}
@media (max-width: 520px) {
  .vh .acts .btn {
    padding: 9px 16px;
    font-size: 13px;
  }
  .pick-top {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
}
/* Settings: the update card stands out; the reminders card is compact */
.card.upd {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 16px 18px;
  border-color: var(--gold);
  background: radial-gradient(420px 160px at 0% 0%, var(--glow), transparent 70%), var(--surf);
}
.upd svg {
  width: 26px;
  height: 26px;
  flex: none;
  fill: none;
  stroke: var(--gold2);
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.upd-t {
  flex: 1;
  min-width: 160px;
}
.upd-t small {
  display: block;
  color: var(--tx3);
  font-size: 12.5px;
}
.card.rem {
  padding: 18px 20px;
}
.rem .set-row {
  padding: 9px 0;
}
.rem h3 {
  font-size: 18px;
  margin-bottom: 2px;
}
.sh-opts {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.sh-opts .sg button {
  padding: 6px 12px;
  font-size: 12.5px;
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}

времено направи резервну копију.","How do I back up, or move to a new phone?":"Како да направим резервну копију или пређем на нови телефон?","Settings → Backup and restore → Save backup saves one file with your collection, journal, tests, photos and settings. On the new phone open Lux, then Restore from file and pick that file. If downloads are blocked, use Copy as text and paste it on the other phone. Lux also keeps a few automatic snapshots on this phone.":"Подешавања → Резервна копија и враћање → Сачувај копију чува један фајл са колекцијом, дневником, тестовима, сликама и подешавањима. На новом телефону отвори Lux, па Restore from file и изабери тај фајл. Ако је преузимање блокирано, користи Copy as text и налепи текст на другом телефону. Lux на телефону чува и неколико аутоматских копија.","How do I add a fragrance?":"Како да додам парфем?","Type its name in the search at the top of the Collection. If it is in the library, tap Add to put it in the cabinet, the heart for the wishlist, or Test. If it is not there, the search offers to add what you typed. You can also use Add fragrance, where the name field suggests matches from the library.":"Укуцај назив у претрагу на врху Колекције. Ако је у библиотеци, додирни Додај да га ставиш у ормар, срце за wishlist или Тест. Ако га нема, претрага нуди да додаш оно што си укуцао. Можеш и преко Додај парфем, где поље за назив предлаже парфеме из библиотеке.","How do I log that I wore something?":"Како да забележим да сам нешто носио?","Tap the bottle and choose Log a wear, or use Log a wear in the Journal. Pick how many sprays and, if you like, your mood and a second fragrance you layered with it. Lux takes the sprays off the ml left and adds the day to the Journal.":"Додирни бочицу и изабери Забележи ношење, или користи Забележи ношење у Дневнику. Изабери број прскања и, ако желиш, расположење и други парфем с којим си га комбиновао. Lux одузме прскања од преосталих ml и дан дода у Дневник.","How does Lux know how much is left?":"Како Lux зна колико је остало?","It counts sprays and divides them by sprays per ml (about 10 for a 100 ml bottle, 12 for 50 to 75 ml, 15 for 30 ml and decants). When you check a bottle, correct Remaining (ml) in its sheet: Lux then learns how much that atomizer really sprays and gets more exact.":"Броји прскања и дели их бројем прскања по ml (око 10 за бочицу од 100 ml, 12 за 50 до 75 ml, 15 за 30 ml и деканте). Кад провериш бочицу, исправи Преостало (ml) у њеном уносу: Lux тада научи колико тај распршивач заиста избацује и постаје тачнији.","How do shelves work?":"Како раде полице?","Shelves are your own groups, such as Daily or Summer. Press and hold a bottle, then drag it to another shelf or to the wishlist. Rename, add or remove shelves in Settings → Shelves.":"Полице су твоје групе, као Свакодневни или Летњи. Држи прст на бочици, па је превуци на другу полицу или на wishlist. Полице преименујеш, додајеш или уклањаш у Подешавања → Shelves.","What is the wishlist for?":"Чему служи wishlist?","Bottles you want but do not own. Stars say how much you want each one, and five stars means you plan to buy it. Add the price you saw and a target price, and Lux marks a good price. Stats → Purchases shows what the five-star bottles would cost.":"Бочице које желиш, а немаш. Звездице кажу колико желиш који парфем, а пет звездица значи да планираш куповину. Унеси виђену и циљну цену, а Lux означи добру цену. Статистика → Куповине показује колико би коштале бочице са пет звездица.","I bought something from the wishlist. What now?":"Купио сам нешто са wishlist. Шта сада?","Open it and tap I bought it. Choose Bottle and it moves to your first shelf, full, with the price you paid. Choose Decant and it becomes its own small bottle in the cabinet, while the full bottle stays on the wishlist.":"Отвори га и додирни Купио сам. Изабери Бочица и прелази на прву полицу, пуна, са ценом коју си платио. Изабери Декант и постаје посебна мала бочица у ормару, а цела бочица остаје на wishlist.","Bottle or decant: what changes?":"Бочица или декант: шта се мења?","A decant starts at 5 ml and is counted with more sprays per ml. Decant or bottle? compares the price per ml of a decant and of the full bottle, and how long each would last at your pace.":"Декант почиње са 5 ml и рачуна се са више прскања по ml. Декант или бочица? пореди цену по ml деканта и целе бочице и колико би свако трајало твојим темпом.","How do I add a picture of a bottle?":"Како да додам слику бочице?","Open the bottle and tap Add photo. A photo of your own bottle looks best. Find a picture online searches Fragrantica first: press and hold a picture, download it, and pick it with Add photo. Remove white background makes the white around the bottle transparent so it stands on the shelf. Settings → Photos lets you add many at once.":"Отвори бочицу и додирни Додај слику. Најлепше изгледа слика твоје бочице. Нађи слику на интернету прво тражи на Fragrantica-и: држи прст на слици, преузми је и изабери је са Додај слику. Уклони белу позадину претвара бело око бочице у провидно, па бочица стоји на полици. У Подешавања → Photos можеш да додаш више слика одједном.","How does the Test lab work?":"Како ради Тест лабораторија?","Tap Start test the moment you spray, on skin or a paper strip. The clock starts then. Add impressions as the scent changes, tap Faded out when it is gone, and rate longevity, sillage and how it smells on skin. Several tests of one fragrance give its average. Starting again the same day continues that day's test.":"Додирни Почни тест чим напрскаш, на кожу или папирну траку. Тада креће сат. Додај утиске док се мирис мења, додирни Нестао кад га више нема, и оцени трајност, траг и како мирише на кожи. Више тестова једног парфема даје његов просек. Ако истог дана поново почнеш, наставља се тест тог дана.","I started a test by mistake. Can I remove it?":"Почео сам тест грешком. Могу ли да га обришем?","Open the test and tap Delete. Only that test is removed; earlier tests of the same fragrance and their ratings stay. If you also logged the sprays in your cabinet, correct the ml and the Journal by hand.":"Отвори тест и додирни Обриши. Брише се само тај тест; ранији тестови истог парфема и њихове оцене остају. Ако си прскања забележио и у ормару, исправи ml и Дневник ручно.","What is Today's pick?":"Шта је Данашњи избор?","A suggestion for today from your own bottles. It looks at the season, the weather in your city, the moods you usually wear each scent in, and bottles that have waited long on the shelf. Another idea shows a different one. With the Android app it can come as a morning notification.":"Предлог за данас од твојих бочица. Гледа годишње доба, време у твом граду, расположења у којима обично носиш који мирис и бочице које дуго чекају на полици. Други предлог показује други парфем. У Android апликацији може да стигне као јутарње обавештење.","What do Stats show?":"Шта показује Статистика?","Pick a period and see what you wore most, sprays and ml used, the value you sprayed, the families and seasons you reach for, when bottles will run out, what each wear costs, and your purchases against a monthly budget.":"Изабери период и види шта си највише носио, потрошена прскања и ml, вредност коју си испрскао, породице и годишња доба које бираш, када ће се бочице испразнити, колико кошта једно ношење и куповине у односу на месечни буџет.","What is the no-buy challenge?":"Шта је изазов без куповине?","In Stats → Purchases, start it to count the days without a new bottle, with a goal you set. Buying a bottle ends the run and it starts again from that day.":"У Статистика → Куповине покрени га да бројиш дане без нове бочице, са циљем који сам одредиш. Куповина бочице прекида низ и он креће поново од тог дана.","What are the notes for?":"Чему служе ноте?","Open a bottle and tap Paste notes: copy the notes from Fragrantica or a shop page and paste them, and top, heart and base fill in. Lux then shows which notes you rate highest and finds fragrances close to what you own.":"Отвори бочицу и додирни Налепи ноте: копирај ноте са Fragrantica-е или странице продавнице и налепи их, па се горње, средње и базне попуне. Lux затим показује које ноте највише оцењујеш и налази парфеме сличне онима које имаш.","What is the library?":"Шта је библиотека?","A list of known fragrances for search and suggestions, written from memory, so check anything important. Add your own entries with New entry, or import a list (CSV or JSON) in Settings → Library and data.":"Списак познатих парфема за претрагу и предлоге, писан по сећању, па провери оно што је важно. Своје уносе додај са Нови унос или увези списак (CSV или JSON) у Подешавања → Library and data.","Can I share my collection?":"Могу ли да поделим своју колекцију?","Yes. Share on the Collection makes a picture of your cabinet, your most worn, your best tested or your month, for Instagram, WhatsApp or anywhere you like.":"Да. Подели на Колекцији прави слику твог ормара, највише ношених, најбоље тестираних или твог месеца, за Instagram, WhatsApp или где год желиш.","Are there widgets and reminders?":"Има ли виџета и подсетника?","In the Android app, yes: home screen widgets for logging a wear, today's pick and your stats, a morning pick notification, and check-ins 2 and 6 hours after a test. Turn them on in Settings → Daily pick and reminders.":"У Android апликацији има: виџети на почетном екрану за бележење ношења, данашњи избор и статистику, јутарње обавештење са избором и подсетници 2 и 6 сати после теста. Укључи их у Подешавања → Daily pick and reminders.","How do I change the look or the language?":"Како да променим изглед или језик?","Settings → Appearance and units: dark, light or automatic theme, gold, rose gold or silver accent, the currency symbol and the language (English, Српски, Norsk, or automatic to follow the phone).":"Подешавања → Appearance and units: тамна, светла или аутоматска тема, акценат злато, розе злато или сребро, ознака валуте и језик (English, Српски, Norsk или аутоматски, као телефон).","I see sample data. How do I start with my own?":"Видим пробне податке. Како да почнем са својим?","Tap Clear sample data in the note on the Collection. The sample bottles and their wears go away; anything you added stays.":"Додирни Обриши пробне податке у напомени на Колекцији. Пробне бочице и њихова ношења нестају; све што си додао остаје.","How Lux works":"Како Lux ради","A short guide to each part of the app":"Кратак водич кроз сваки део апликације","* answers, from backups to the Test lab":"* одговора, од резервне копије до Тест лабораторије","Back to Settings":"Назад на Подешавања","‹ Back to Settings":"‹ Назад на Подешавања","Export as CSV":"Извези као CSV","If files do not work: backup as text":"Ако фајлови не раде: копија као текст","Copy the backup as text and paste it somewhere safe, or paste one here to restore it.":"Копирај копију као текст и налепи је на сигурно место, или налепи копију овде да је вратиш.","Automatic snapshots (*)":"Аутоматске копије (*)","A safety net if a restore or an erase was a mistake: the last three copies, saved about once a day and before every restore or erase.":"Сигурносна мрежа ако је враћање или брисање било грешка: последње три копије, чуване отприлике једном дневно и пре сваког враћања или брисања.","Importing your own list? Start from the":"Увозиш свој списак? Почни од","table template":"шаблона табеле","A table for a spreadsheet. A backup is still the way to move your data.":"Табела за табеларни програм. За пренос података и даље користи резервну копију.","Show the welcome again":"Прикажи поново добродошлицу","A private cabinet for your fragrances, wears and tests.":"Приватни ормар за твоје парфеме, ношења и тестове.","Logging a wear":"Бележење ношења","Your data":"Твоји подаци","Your bottles stand on shelves with the ml left in each. Tap a bottle to see its details, change it or log a wear. Press and hold a bottle to drag it to another shelf or to the wishlist. The search at the top finds any fragrance in your cabinet, on the wishlist or in the library, and adds new ones.":"Твоје бочице стоје на полицама, са преосталим ml у свакој. Додирни бочицу да видиш детаље, измениш је или забележиш ношење. Држи прст на бочици да је превучеш на другу полицу или на wishlist. Претрага на врху налази сваки парфем у ормару, на wishlist или у библиотеци и додаје нове.","Each time you wear a fragrance, log it with the number of sprays. Lux takes them off the ml left, learns your pace and tells you when a bottle will run out. Add your mood or a second fragrance you layered it with if you like.":"Сваки пут кад носиш парфем, забележи то са бројем прскања. Lux их одузме од преосталих ml, научи твој темпо и каже ти када ће се бочица испразнити. Ако желиш, додај расположење или други парфем с којим си га комбиновао.","Bottles you want. Stars say how much, five stars means you plan to buy it. Note the price you saw and a target price. When you buy one, I bought it moves the bottle to your cabinet or adds a decant.":"Бочице које желиш. Звездице кажу колико, а пет звездица значи да планираш куповину. Забележи виђену и циљну цену. Кад купиш, Купио сам премешта бочицу у ормар или додаје декант.","For trying a fragrance in a shop or from a sample. Start the test when you spray, add impressions as it changes, mark when it fades and rate it. Several tests of one fragrance give its average, and you can compare two fragrances on one radar.":"За пробање парфема у продавници или из узорка. Почни тест кад напрскаш, додај утиске док се мења, означи кад нестане и оцени га. Више тестова једног парфема даје његов просек, а два парфема можеш да упоредиш на једном радару.","Every day Lux suggests one of your bottles, from the season, the weather in your city, your mood and the bottles that have waited longest.":"Lux ти сваког дана предлаже једну од твојих бочица, према годишњем добу, времену у твом граду, расположењу и бочицама које најдуже чекају.","A calendar of everything you wore. Tap a day to see or change it.":"Календар свега што си носио. Додирни дан да га видиш или измениш.","What you wear most, what you spend, the value you spray, your favourite families and seasons, a monthly budget and the no-buy challenge.":"Шта највише носиш, колико трошиш, вредност коју испрскаш, омиљене породице и годишња доба, месечни буџет и изазов без куповине.","Everything stays on this phone, with no account. Download a backup now and then, and restore it on a new phone.":"Све остаје на овом телефону, без налога. Повремено преузми резервну копију и врати је на новом телефону.","Today’s suggestion":"Данашњи предлог","Reminder on":"Подсетник укључен","Reminder off":"Подсетник искључен","Save backup":"Сачувај копију","Export":"Извези"},

","Only on this phone. Lux has no account and no server, and nothing is sent anywhere. Weather is the only thing fetched from the internet, and only your city's coordinates are sent for it. Because everything is on the phone, make a backup now and then.":"Bare på denne telefonen. Lux har ingen konto og ingen server, og ingenting sendes noe sted. Været er det eneste som hentes fra internett, og da sendes bare koordinatene til byen din. Siden alt ligger på telefonen, bør du ta sikkerhetskopi av og til.","How do I back up, or move to a new phone?":"Hvordan tar jeg sikkerhetskopi, eller flytter til en ny telefon?","Settings → Backup and restore → Save backup saves one file with your collection, journal, tests, photos and settings. On the new phone open Lux, then Restore from file and pick that file. If downloads are blocked, use Copy as text and paste it on the other phone. Lux also keeps a few automatic snapshots on this phone.":"Innstillinger → Sikkerhetskopi og gjenoppretting → Lagre kopi lagrer én fil med samlingen, journalen, testene, bildene og innstillingene. På den nye telefonen åpner du Lux, så Gjenopprett fra fil og velger filen. Er nedlasting blokkert, bruk Kopier som tekst og lim den inn på den andre telefonen. Lux tar også noen automatiske øyeblikksbilder på denne telefonen.","How do I add a fragrance?":"Hvordan legger jeg til en duft?","Type its name in the search at the top of the Collection. If it is in the library, tap Add to put it in the cabinet, the heart for the wishlist, or Test. If it is not there, the search offers to add what you typed. You can also use Add fragrance, where the name field suggests matches from the library.":"Skriv navnet i søket øverst i Samling. Finnes den i biblioteket, trykker du Legg til for å legge den i skapet, hjertet for ønskelisten eller Test. Finnes den ikke, tilbyr søket å legge til det du skrev. Du kan også bruke Legg til duft, der navnefeltet foreslår treff fra biblioteket.","How do I log that I wore something?":"Hvordan registrerer jeg at jeg brukte noe?","Tap the bottle and choose Log a wear, or use Log a wear in the Journal. Pick how many sprays and, if you like, your mood and a second fragrance you layered with it. Lux takes the sprays off the ml left and adds the day to the Journal.":"Trykk på flasken og velg Registrer bruk, eller bruk Registrer bruk i journalen. Velg antall spray og, om du vil, humøret og en duft du kombinerte den med. Lux trekker sprayene fra ml igjen og legger dagen til i journalen.","How does Lux know how much is left?":"Hvordan vet Lux hvor mye som er igjen?","It counts sprays and divides them by sprays per ml (about 10 for a 100 ml bottle, 12 for 50 to 75 ml, 15 for 30 ml and decants). When you check a bottle, correct Remaining (ml) in its sheet: Lux then learns how much that atomizer really sprays and gets more exact.":"Den teller spray og deler dem på spray per ml (omtrent 10 for en flaske på 100 ml, 12 for 50 til 75 ml, 15 for 30 ml og dekanter). Når du sjekker en flaske, retter du Igjen (ml) i den: Da lærer Lux hvor mye forstøveren faktisk gir og blir mer nøyaktig.","How do shelves work?":"Hvordan fungerer hyllene?","Shelves are your own groups, such as Daily or Summer. Press and hold a bottle, then drag it to another shelf or to the wishlist. Rename, add or remove shelves in Settings → Shelves.":"Hyllene er dine egne grupper, som Daglig eller Sommer. Trykk og hold på en flaske, og dra den til en annen hylle eller til ønskelisten. Gi nytt navn, legg til eller fjern hyller i Innstillinger → Hyller.","What is the wishlist for?":"Hva er ønskelisten til?","Bottles you want but do not own. Stars say how much you want each one, and five stars means you plan to buy it. Add the price you saw and a target price, and Lux marks a good price. Stats → Purchases shows what the five-star bottles would cost.":"Flasker du ønsker deg, men ikke har. Stjernene sier hvor mye du vil ha hver, og fem stjerner betyr at du planlegger å kjøpe den. Legg inn prisen du så og en målpris, så merker Lux en god pris. Statistikk → Kjøp viser hva femstjernersflaskene ville kostet.","I bought something from the wishlist. What now?":"Jeg kjøpte noe fra ønskelisten. Hva nå?","Open it and tap I bought it. Choose Bottle and it moves to your first shelf, full, with the price you paid. Choose Decant and it becomes its own small bottle in the cabinet, while the full bottle stays on the wishlist.":"Åpne den og trykk Jeg kjøpte den. Velg Flaske, så flyttes den til den første hyllen, full, med prisen du betalte. Velg Dekant, så blir den en egen liten flaske i skapet, mens den hele flasken blir på ønskelisten.","Bottle or decant: what changes?":"Flaske eller dekant: hva endres?","A decant starts at 5 ml and is counted with more sprays per ml. Decant or bottle? compares the price per ml of a decant and of the full bottle, and how long each would last at your pace.":"En dekant starter på 5 ml og regnes med flere spray per ml. Dekant eller flaske? sammenligner prisen per ml for en dekant og hele flasken, og hvor lenge hver ville vart i ditt tempo.","How do I add a picture of a bottle?":"Hvordan legger jeg til et bilde av en flaske?","Open the bottle and tap Add photo. A photo of your own bottle looks best. Find a picture online searches Fragrantica first: press and hold a picture, download it, and pick it with Add photo. Remove white background makes the white around the bottle transparent so it stands on the shelf. Settings → Photos lets you add many at once.":"Åpne flasken og trykk Legg til bilde. Et bilde av din egen flaske ser best ut. Finn et bilde på nettet søker først på Fragrantica: trykk og hold på et bilde, last det ned og velg det med Legg til bilde. Fjern hvit bakgrunn gjør det hvite rundt flasken gjennomsiktig, så den står på hyllen. I Innstillinger → Bilder kan du legge til mange samtidig.","How does the Test lab work?":"Hvordan fungerer testlaben?","Tap Start test the moment you spray, on skin or a paper strip. The clock starts then. Add impressions as the scent changes, tap Faded out when it is gone, and rate longevity, sillage and how it smells on skin. Several tests of one fragrance give its average. Starting again the same day continues that day's test.":"Trykk Start test i det du sprayer, på huden eller en papirstrimmel. Da starter klokka. Legg til inntrykk mens duften endrer seg, trykk Borte når den er borte, og vurder holdbarhet, sillage og hvordan den dufter på huden. Flere tester av én duft gir gjennomsnittet. Starter du igjen samme dag, fortsetter dagens test.","I started a test by mistake. Can I remove it?":"Jeg startet en test ved en feil. Kan jeg fjerne den?","Open the test and tap Delete. Only that test is removed; earlier tests of the same fragrance and their ratings stay. If you also logged the sprays in your cabinet, correct the ml and the Journal by hand.":"Åpne testen og trykk Slett. Bare den testen fjernes; tidligere tester av samme duft og vurderingene deres blir værende. Registrerte du også sprayene i skapet, retter du ml og journalen manuelt.","What is Today's pick?":"Hva er Dagens valg?","A suggestion for today from your own bottles. It looks at the season, the weather in your city, the moods you usually wear each scent in, and bottles that have waited long on the shelf. Another idea shows a different one. With the Android app it can come as a morning notification.":"Et forslag for i dag fra dine egne flasker. Det ser på årstiden, været i byen din, humørene du vanligvis bruker hver duft i, og flasker som har ventet lenge på hyllen. En annen idé viser en annen. Med Android-appen kan det komme som et morgenvarsel.","What do Stats show?":"Hva viser Statistikk?","Pick a period and see what you wore most, sprays and ml used, the value you sprayed, the families and seasons you reach for, when bottles will run out, what each wear costs, and your purchases against a monthly budget.":"Velg en periode og se hva du brukte mest, spray og ml brukt, verdien du har sprayet, familiene og årstidene du velger, når flaskene går tomme, hva hver bruk koster, og kjøpene dine mot et månedlig budsjett.","What is the no-buy challenge?":"Hva er kjøpestopp-utfordringen?","In Stats → Purchases, start it to count the days without a new bottle, with a goal you set. Buying a bottle ends the run and it starts again from that day.":"I Statistikk → Kjøp starter du den for å telle dagene uten en ny flaske, med et mål du setter. Kjøper du en flaske, slutter rekken, og den starter på nytt fra den dagen.","What are the notes for?":"Hva er notene til?","Open a bottle and tap Paste notes: copy the notes from Fragrantica or a shop page and paste them, and top, heart and base fill in. Lux then shows which notes you rate highest and finds fragrances close to what you own.":"Åpne en flaske og trykk Lim inn noter: kopier notene fra Fragrantica eller en butikkside og lim dem inn, så fylles topp, hjerte og base inn. Lux viser så hvilke noter du gir høyest poeng og finner dufter som likner det du har.","What is the library?":"Hva er biblioteket?","A list of known fragrances for search and suggestions, written from memory, so check anything important. Add your own entries with New entry, or import a list (CSV or JSON) in Settings → Library and data.":"En liste over kjente dufter for søk og forslag, skrevet etter hukommelsen, så sjekk det som er viktig. Legg til egne oppføringer med Ny oppføring, eller importer en liste (CSV eller JSON) i Innstillinger → Bibliotek og data.","Can I share my collection?":"Kan jeg dele samlingen min?","Yes. Share on the Collection makes a picture of your cabinet, your most worn, your best tested or your month, for Instagram, WhatsApp or anywhere you like.":"Ja. Del i Samling lager et bilde av skapet ditt, de mest brukte, de best testede eller måneden din, for Instagram, WhatsApp eller hvor du vil.","Are there widgets and reminders?":"Finnes det widgeter og påminnelser?","In the Android app, yes: home screen widgets for logging a wear, today's pick and your stats, a morning pick notification, and check-ins 2 and 6 hours after a test. Turn them on in Settings → Daily pick and reminders.":"I Android-appen, ja: widgeter på startskjermen for å registrere bruk, dagens valg og statistikk, et morgenvarsel med valget og påminnelser 2 og 6 timer etter en test. Slå dem på i Innstillinger → Dagens valg og påminnelser.","How do I change the look or the language?":"Hvordan endrer jeg utseendet eller språket?","Settings → Appearance and units: dark, light or automatic theme, gold, rose gold or silver accent, the currency symbol and the language (English, Српски, Norsk, or automatic to follow the phone).":"Innstillinger → Utseende og enheter: mørkt, lyst eller automatisk tema, aksent i gull, rosegull eller sølv, valutasymbol og språk (English, Српски, Norsk, eller automatisk som telefonen).","I see sample data. How do I start with my own?":"Jeg ser eksempeldata. Hvordan starter jeg med mine egne?","Tap Clear sample data in the note on the Collection. The sample bottles and their wears go away; anything you added stays.":"Trykk Fjern eksempeldata i merknaden på Samling. Eksempelflaskene og bruken deres forsvinner; alt du har lagt til blir værende.","How Lux works":"Slik fungerer Lux","A short guide to each part of the app":"En kort guide til hver del av appen","* answers, from backups to the Test lab":"* svar, fra sikkerhetskopi til testlaben","Back to Settings":"Tilbake til Innstillinger","‹ Back to Settings":"‹ Tilbake til Innstillinger","Export as CSV":"Eksporter som CSV","If files do not work: backup as text":"Hvis filer ikke fungerer: sikkerhetskopi som tekst","Copy the backup as text and paste it somewhere safe, or paste one here to restore it.":"Kopier sikkerhetskopien som tekst og lim den inn et trygt sted, eller lim inn en her for å gjenopprette den.","Automatic snapshots (*)":"Automatiske øyeblikksbilder (*)","A safety net if a restore or an erase was a mistake: the last three copies, saved about once a day and before every restore or erase.":"Et sikkerhetsnett hvis en gjenoppretting eller sletting var en feil: de tre siste kopiene, lagret omtrent én gang om dagen og før hver gjenoppretting eller sletting.","Importing your own list? Start from the":"Importerer du din egen liste? Start med","table template":"tabellmalen","A table for a spreadsheet. A backup is still the way to move your data.":"En tabell for et regneark. En sikkerhetskopi er fortsatt måten å flytte dataene på.","Show the welcome again":"Vis velkomsten igjen","A private cabinet for your fragrances, wears and tests.":"Et privat skap for duftene, bruken og testene dine.","Logging a wear":"Registrere bruk","Your data":"Dataene dine","Your bottles stand on shelves with the ml left in each. Tap a bottle to see its details, change it or log a wear. Press and hold a bottle to drag it to another shelf or to the wishlist. The search at the top finds any fragrance in your cabinet, on the wishlist or in the library, and adds new ones.":"Flaskene dine står på hyller med ml igjen i hver. Trykk på en flaske for å se detaljer, endre den eller registrere bruk. Trykk og hold på en flaske for å dra den til en annen hylle eller til ønskelisten. Søket øverst finner enhver duft i skapet, på ønskelisten eller i biblioteket, og legger til nye.","Each time you wear a fragrance, log it with the number of sprays. Lux takes them off the ml left, learns your pace and tells you when a bottle will run out. Add your mood or a second fragrance you layered it with if you like.":"Hver gang du bruker en duft, registrerer du den med antall spray. Lux trekker dem fra ml igjen, lærer tempoet ditt og forteller når en flaske går tom. Legg til humøret eller en duft du kombinerte den med om du vil.","Bottles you want. Stars say how much, five stars means you plan to buy it. Note the price you saw and a target price. When you buy one, I bought it moves the bottle to your cabinet or adds a decant.":"Flasker du ønsker deg. Stjernene sier hvor mye, fem stjerner betyr /* Makes the white background of a bottle picture transparent, so the bottle stands on the shelf in
 either theme. Only white that touches the edge is removed (a white label stays), the edge is
 softened, and the picture is cropped to the bottle. Resolves null when there is no white edge. */
function removeWhite(url) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onerror = rej;
    im.onload = () => {
      const w = im.naturalWidth,
        h = im.naturalHeight,
        c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const x = c.getContext('2d');
      x.drawImage(im, 0, 0);
      const D = x.getImageData(0, 0, w, h),
        a = D.data,
        seen = new Uint8Array(w * h),
        light = i => {
          const r = a[i * 4],
            g = a[i * 4 + 1],
            b = a[i * 4 + 2],
            lo = Math.min(r, g, b);
          return a[i * 4 + 3] > 0 && lo >= 214 && Math.max(r, g, b) - lo <= 28;
        },
        st = [];
      for (let i = 0; i < w; i++) st.push(i, (h - 1) * w + i);
      for (let j = 0; j < h; j++) st.push(j * w, j * w + w - 1);
      let n = 0;
      while (st.length) {
        const i = st.pop();
        if (seen[i] || !light(i)) continue;
        seen[i] = 1;
        n++;
        const px = i % w,
          py = (i / w) | 0;
        if (px > 0) st.push(i - 1);
        if (px < w - 1) st.push(i + 1);
        if (py > 0) st.push(i - w);
        if (py < h - 1) st.push(i + w);
      }
      if (n < w * h * 0.05) return res(null);
      for (let i = 0; i < w * h; i++) {
        if (seen[i]) {
          /* near pure white goes fully, light grey (shadow, edge) partly */
          const lo = Math.min(a[i * 4], a[i * 4 + 1], a[i * 4 + 2]);
          a[i * 4 + 3] = lo >= 240 ? 0 : Math.round(((240 - lo) / 26) * 255 * 0.6);
        }
      }
      x.putImageData(D, 0, 0);
      let x0 = w,
        y0 = h,
        x1 = -1,
        y1 = -1;
      for (let j = 0; j < h; j++)
        for (let i = 0; i < w; i++)
          if (a[(j * w + i) * 4 + 3] > 40) {
            if (i < x0) x0 = i;
            if (i > x1) x1 = i;
            if (j < y0) y0 = j;
            if (j > y1) y1 = j;
          }
      if (x1 < 0) return res(null);
      const o = document.createElement('canvas');
      o.width = x1 - x0 + 1;
      o.height = y1 - y0 + 1;
      o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      const u = o.toDataURL('image/webp', 0.9);
      res(u.startsWith('data:image/webp') ? u : o.toDataURL('image/png'));
    };
    im.src = url;
  });
}
function compressImage(file) {

function insCompute() {

    t0 = perStart(per),
    wp = {};
  allWears().forEach(w => {
    const q = byId(w.pid);
    if (w.t >= t0 && q) {
      const o = wp[w.pid] || (wp[w.pid] = { c: 0, n: 0, ml: 0 });
      o.c++;
      o.n += w.n;
      o.ml += w.n / rateOf(q);
    }
  });
  const map = new Map();
  owned().forEach(p => {
    let v = 0;
    const o = wp[p.id] || { c: 0, n: 0, ml: 0 };
    v =
      m === 'ml'
        ? p.ml
        : m === 'spr'
          ? p.ml * rateOf(p)
          : m === 'used'
            ? p.sprays || 0
            : m === 'wears'
              ? o.c
              : m === 'pspr'
                ? o.n
                : m === 'pml'
                  ? o.ml
                  : m === 'pval'
                    ? o.ml * perMl(p)
                    : m === 'cval'
                      ? valueLeft(p)
                      : +p.price || 0;
    const key =
      g === 'perfume'
        ? p.name
        : g === 'brand'
          ? p.brand
          : g === 'shelf'
            ? shelfName(p.shelf)
            : g === 'fam'
              ? p.fam || 'Unclassified'
              : p.type || 'Bottle';
    map.set(key, (map.get(key) || 0) + v);
  });
  let arr = [...map]
    .map(([k, v]) => ({ k, v }))
    .filter(x => x.v > 0)
    .sort((a, b) => b.v - a.v);
  if (arr.length > 7) {
    const rest = arr.slice(7).reduce((a, x) => a + x.v, 0);
    arr = arr.slice(0, 7);
    arr.push({ k: 'Other', v: rest });
  }
  return { arr, total: arr.reduce((a, x) => a + x.v, 0), wp, t0 };
}

function activityHtml(per) {

let LIBV = [];
function libRows() {
  LIBV = libFind(ui.lq, { b: ui.lb, f: ui.lf, c: ui.lc });
  const show = LIBV.slice(0, ui.llim);
  const wished = new Set(S.perfumes.filter(p => notOwn(p.shelf)).map(p => norm(p.brand + ' ' + p.name)));
  if (!show.length)
    return '<p class="muted" style="padding:22px 4px">No matches. Try fewer words, or add it as your own entry.</p>';
  return (
    show
      .map(i => {
        const e = LIB[i],
          w = wished.has(e.k);
        return `<div class="lrow"><div class="th">${bt({ name: e.n, brand: e.b, fam: e.f }, 0.7)}</div><div class="mid"><div class="t1" data-raw>${esc(e.n)}</div><div class="t2">${[esc(e.b), esc(e.f), esc(e.c), e.y || ''].filter(Boolean).join(' \u00b7 ')}${e.s ? ' \u00b7 ' + e.s + ' ml' : ''}</div>${e.t ? `<div class="t3">${esc(e.t)}</div>` : ''}</div><div class="ac"><button class="ic${w ? ' on' : ''}" data-act="lwish" data-i="${i}" aria-label="Add to wishlist">${w ? '\u2665' : '\u2661'}</button><button class="btn sm" data-act="ladd" data-i="${i}">Add</button></div></div>`;
      })
      .join('') +
    (LIBV.length > ui.llim
      ? `<div style="text-align:center;padding:18px"><button class="btn ghost sm" data-act="lmore">Show more (${fmt(LIBV.length - ui.llim)} left)</button></div>`
      : '')
  );
}
/* Search on the Collection: what you have (cabinet and wishlist) first, then the library, and a way
 to add a fragrance that is in neither, to the wishlist, to a test or to the cabinet. */
function gsRows() {
  const q = (ui.gq || '').trim(),
    words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return '';
  const T = window.__luxTest,
    have = new Set(S.perfumes.map(p => norm(p.brand + ' ' + p.name))),
    mine = S.perfumes.filter(p => words.every(w => norm(p.brand + ' ' + p.name).includes(w))).slice(0, 6),
    lib = libFind(q)
      .filter(i => !have.has(LIB[i].k))
      .slice(0, 8);
  const row = (th, t1, t2, ac, attrs) =>
    `<div class="lrow"${attrs || ''}><div class="th">${th}</div><div class="mid"><div class="t1">${t1}</div><div class="t2">${t2}</div></div><div class="ac">${ac}</div></div>`;
  return (
    mine
      .map(p =>
        row(
          bt(p, notOwn(p.shelf) ? 1 : p.maxMl ? p.ml / p.maxMl : 0),
          esc(p.name),
          esc(p.brand) + ' \u00b7 ' + (notOwn(p.shelf) ? 'on your wishlist' : 'in ' + esc(shelfName(p.shelf))),
          `<button class="btn ghost sm" data-act="open" data-id="${p.id}">Open</button>`
        )
      )
      .join('') +
    lib
      .map(i => {
        const e = LIB[i];
        return row(
          bt({ name: e.n, brand: e.b, fam: e.f }, 0.7),
          esc(e.n),
          [esc(e.b), esc(e.c), e.s ? e.s + ' ml' : ''].filter(Boolean).join(' \u00b7 '),
          `<button class="ic" data-act="lwish" data-i="${i}" aria-label="Add to wishlist">\u2661</button>${T ? `<button class="btn ghost sm" data-act="gtest" data-i="${i}">Test</button>` : ''}<button class="btn sm" data-act="ladd" data-i="${i}">Add</button>`
        );
      })
      .join('') +
    `<div class="gs-new">${mine.length || lib.length ? 'Not the one?' : 'Not in your cabinet or the library.'} Add \u201c${esc(q)}\u201d<div class="acts"><button class="btn ghost sm" data-act="gnew" data-to="wish">To the wishlist</button>${T ? '<button class="btn ghost sm" data-act="gnew" data-to="test">Test it</button>' : ''}<button class="btn sm" data-act="gnew" data-to="cab">To the cabinet</button></div></div>`
  );
}
function updateGs() {

/* "Match device": the Android app reports the phone's dark mode itself (a WebView follows the app's
   own theme, which is always dark); browsers use prefers-color-scheme. The app's status and
   navigation bars follow the page. */
function applyTheme() {
  const t = S.settings.theme,
    r = document.documentElement,
    and = window.LuxAndroid && LuxAndroid.isNight;
  const ac = S.settings.accent;
  if (ac && ac !== 'gold') r.setAttribute('data-accent', ac);
  else r.removeAttribute('data-accent');
  const eff =
    t !== 'auto'
      ? t
      : and
        ? LuxAndroid.isNight()
          ? 'dark'
          : 'light'
        : matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'dark';
  if (t === 'auto' && !and) r.removeAttribute('data-theme');
  else r.setAttribute('data-theme', eff);
  const bg = getComputedStyle(r).getPropertyValue('--bg').trim(),
    m = document.querySelector('meta[name="theme-color"]');
  if (m && bg) m.setAttribute('content', bg);
  try {
    if (window.LuxAndroid && LuxAndroid.setBars && bg) LuxAndroid.setBars(bg, eff === 'light');
  } catch (e) {}
}
window.luxThemeChanged = () => applyTheme();
try {
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if (S && S.settings.theme === 'auto') applyTheme();
  });
} catch (e) {}

function commitSheet() {
  readSheet();
  const d = D,
    lb0 = lastBuy();
  d.name = String(d.name || '').trim();
  d.brand = String(d.brand || '').trim();
  if (!d.name || !d.brand) {
    toast('Add a name and a house first');
    return false;
  }
  if (ui.pyrEdit && d._pyr) {
    setPyr(d.brand, d.name, d._pyr);
    ui.pyrEdit = false;
  }
  delete d._pyr;
  d.maxMl = Math.max(1, +d.maxMl || 100);
  d.ml = Math.round(clamp(+d.ml || 0, 0, d.maxMl) * 10) / 10;
  d.price = d.price === '' ? '' : Math.max(0, +d.price || 0);
  d.year = +d.year || '';
  d.longevity = d.longevity === '' ? '' : Math.max(0, +d.longevity || 0);
  ['seen', 'target'].forEach(k => {
    if (d[k] != null) d[k] = d[k] === '' ? '' : Math.max(0, +d[k] || 0);
  });
  if (d.where != null) d.where = String(d.where).trim();
  if (d.spm != null) d.spm = +d.spm > 0 ? clamp(+d.spm, 3, 40) : '';
  if (sheetNew) {
    d.cal = { ml: d.ml, sprays: d.sprays || 0 };
    S.perfumes.push(d);
    const sv = $('#f-savelib');
    if (sv && sv.checked && !LIB.some(e => e.k === norm(d.brand + ' ' + d.name))) {
      S.mine.push({ n: d.name, b: d.brand, f: d.fam, c: d.conc, y: d.year, s: d.maxMl, t: '' });
      buildLib();
    }
    sheetNew = false;
  } else {
    const i = S.perfumes.findIndex(p => p.id === d.id);
    if (i >= 0) {
      const old = S.perfumes[i];
      if (notOwn(old.shelf) || notOwn(d.shelf) || !d.cal) d.cal = { ml: d.ml, sprays: d.sprays || 0 };
      else if (Math.abs((+old.ml || 0) - d.ml) >= 0.1) learnRate(d, old);
      S.perfumes[i] = d;
    }
  }
  nbCheck(lb0);
  save();
  return true;
}

function parseCSV(t) {
  const first = t.split(/\r?\n/, 1)[0];
  const d = [',', ';', '\t', '|'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = [];
  let r = [],
    f = '',
    q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"') {
        if (t[i + 1] === '"') {
          f += '"';
          i++;
        } else q = false;
      } else f += c;
    } else if (c === '"') q = true;
    else if (c === d) {
      r.push(f);
      f = '';
    } else if (c === '\n') {
      r.push(f);
      rows.push(r);
      r = [];
      f = '';
    } else if (c !== '\r') f += c;
  }
  if (f || r.length) {
    r.push(f);
    rows.push(r);
  }

}

  if (name < 0) name = f(/perfume|name|fragrance|title/);

    name,
    brand: f(/^(brand|house|designer|company|marka)/),
    fam: f(/famil|olfactive|category|group/),
    conc: f(/conc|strength/),
    year: f(/^(year|launch|release)/),
    size: f(/^(size|volume|ml)/),
    notes: -1

  const a = f(/accord/);

}
/* Top / Middle (or Heart) / Base columns, also "Top notes" and the like */
function pyrCols(h) {

    i = re => l.findIndex(x => re.test(x)),
    c = { top: i(/^(top|head)( notes?)?$/), mid: i(/^(middle|heart)( notes?)?$/), base: i(/^base( notes?)?$/) };

function startImport(text, fname) {

      if (!Array.isArray(j) || !j.length) throw 0;

 <div class="cols">${F.map(f => `<div class="fg"><label>${f[1]}</label>${sel(f[0])}</div>`).join('')}</div>

async function doImport() {

    return;
  }
  const ex = new Set(LIB.map(e => e.k)),
    add = [];
  let skip = 0;
  const pc = m.notes === 'combo' ? pyrCols(IMP.head) : null;
  const cell = (r, i) => (typeof i === 'number' && i >= 0 ? String(r[i] == null ? '' : r[i]).trim() : '');
  IMP.rows.forEach(r => {
    const n = cell(r, m.name);
    if (!n) return;
    const b = cell(r, m.brand) || 'Unknown';
    const y = pc
      ? { top: splitNotes(cell(r, pc.top)), mid: splitNotes(cell(r, pc.mid)), base: splitNotes(cell(r, pc.base)) }
      : null;
    const notes = y ? pyrAll(y).join(', ') : cell(r, m.notes);
    const key = norm(b + ' ' + n);
    if (ex.has(key)) {

    }
    ex.add(key);
    const row = [
      n,
      b,
      cell(r, m.fam) || inferFam(notes),
      cell(r, m.conc),
      parseInt(cell(r, m.year)) || 0,
      parseFloat(cell(r, m.size)) || 0,

    if (y && pyrAll(y).length) row.push(y);

  closeModal();
  render();

async function buildBackup() {

    const d = PHOTOS[id] || (await idb.get('photo:' + id));
    if (d) photos[id] = d;
  }
  return JSON.stringify({
    app: 'lux-perfume-cabinet',
    v: 2,
    exportedAt: new Date().toISOString(),
    state: S,
    photos,
    imported: IMPORTED

}
function backupSaved() {
  S.settings.lastBackup = Date.now();
  persist();
  toast('Backup saved');
  if (ui.tab === 'set' || ui.tab === 'shelf') render();
}
window.luxBackupSaved = backupSaved; /* called by the Android app once the file is written */
async function backupNow() {
  const txt = await buildBackup(),
    name = 'lux-backup-' + dkey(Date.now()) + '.json';
  let done = false;
  if (window.LuxAndroid) {
    LuxAndroid.saveFile(name, txt);
    return;
  } /* WebView cannot download blob: URLs */
  try {
    const c = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (c) {
      await c.save({ filename: name, data: txt });
      done = true;
    }
  } catch (e) {
    if (e && e.code === 'declined') return;
  }
  if (!done) {
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' }));
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      done = true;
    } catch (e) {}
  }
  if (done) backupSaved();
  else toast('Downloads are blocked here. Use Copy as text.');
}
async function backupCopy() {
  const txt = await buildBackup();
  let ok = false;
  try {
    await navigator.clipboard.writeText(txt);
    ok = true;
  } catch (e) {}
  if (!ok) {
    const ta = $('#bk-text');
    if (ta) {
      ta.value = txt;
      ta.focus();
      ta.select();
      try {
        ok = document.execCommand('copy');
      } catch (e) {}
    }
  }
  if (ok) {
    S.settings.lastBackup = Date.now();
    persist();
    toast('Backup copied. Paste it somewhere safe.');
  } else toast('Select the text in the box and copy it manually');
}
async function restoreText(txt) {
  let o;
  try {
    o = JSON.parse(txt);
  } catch (e) {
    toast('That is not a valid backup');
    return;
  }
  if (!o || o.app !== 'lux-perfume-cabinet' || !o.state || !Array.isArray(o.state.perfumes)) {
    toast('That is not a Lux backup');
    return;
  }
  const ok = await askConfirm(
    'Restore this backup?',
    `It holds ${o.state.perfumes.length} fragrances and ${(o.state.wears || []).length} wears. Your current data is snapshotted first, then replaced.`,
    'Restore'
  );
  if (!ok) return;
  snapNow('Before restore');
  for (const id of photoIds()) await idb.del('photo:' + id);
  S = migrate(o.state);
  PHOTOS = {};
  for (const id in o.photos || {}) {
    PHOTOS[id] = o.photos[id];
    await idb.set('photo:' + id, o.photos[id]);
  }
  if (Array.isArray(o.imported)) {
    IMPORTED = o.imported;
    await idb.set('imported', IMPORTED);
  }
  persist();
  applyTheme();
  buildLib();
  render();
  toast('Backup restored');
}

/* ================= drag and drop (pointer based, works with touch) ================= */
const dnd = {
  id: null,
  el: null,
  sx: 0,
  sy: 0,
  lx: 0,
  ly: 0,
  on: false,
  timer: null,
  pt: '',
  ghost: null,
  tgt: null,
  ended: 0
};
function clearMarks() {
  $$('.rack.over').forEach(r => r.classList.remove('over'));
  $$('.it.drop-l,.it.drop-r').forEach(i => i.classList.remove('drop-l', 'drop-r'));
}
function dndStart(x, y) {
  if (!dnd.el) return;
  dnd.on = true;
  dnd.el.classList.add('dragging');
  const g = document.createElement('div');
  g.className = 'ghost-el';
  const b = $('.bt', dnd.el);
  g.innerHTML = b ? b.outerHTML : '';
  document.body.appendChild(g);
  dnd.ghost = g;
  document.body.classList.add('dragging-on');
  try {
    if (navigator.vibrate) navigator.vibrate(12);
  } catch (e) {}
  dndMove(x, y);
}
function dndMove(x, y) {
  dnd.ghost.style.transform = `translate(${x - 45}px,${y - 72}px) scale(1.06)`;
  clearMarks();
  dnd.tgt = null;
  const el = document.elementFromPoint(x, y);
  if (el) {
    const it = el.closest('.it'),
      rk = el.closest('.rack');
    if (it && it.dataset.id === dnd.id) {
      dnd.tgt = null;
    } else if (it) {
      const r = it.getBoundingClientRect(),
        after = x > r.left + r.width / 2;
      it.classList.add(after ? 'drop-r' : 'drop-l');
      dnd.tgt = { id: it.dataset.id, after };
    } else if (rk) {
      rk.classList.add('over');
      dnd.tgt = { shelf: rk.dataset.shelf };
    }
  }
  if (y < 90) scrollBy(0, -16);
  else if (y > innerHeight - 90) scrollBy(0, 16);
}
function dndEnd(commit) {
  clearTimeout(dnd.timer);
  if (dnd.on) {
    const t = dnd.tgt,
      id = dnd.id;
    if (dnd.ghost) dnd.ghost.remove();
    if (dnd.el) dnd.el.classList.remove('dragging');
    clearMarks();
    document.body.classList.remove('dragging-on');
    dnd.ended = Date.now();
    dnd.on = false;
    dnd.ghost = null;
    if (commit && t) movePerfume(id, t);
  }
  dnd.id = null;
  dnd.el = null;
}
function movePerfume(id, t) {
  const i = S.perfumes.findIndex(p => p.id === id);
  if (i < 0) return;
  const [p] = S.perfumes.splice(i, 1);
  if (t.id) {
    const j = S.perfumes.findIndex(q => q.id === t.id);
    if (j < 0) {
      S.perfumes.push(p);
    } else {
      p.shelf = S.perfumes[j].shelf;
      S.perfumes.splice(j + (t.after ? 1 : 0), 0, p);
    }
  } else {
    p.shelf = t.shelf;
    S.perfumes.push(p);
  }
  save();
  render();
  toast(`${p.name} is on ${shelfName(p.shelf)}`);
}
const viewEl = $('#view');
viewEl.addEventListener('pointerdown', e => {
  const it = e.target.closest('.it');
  if (!it || (e.pointerType === 'mouse' && e.button !== 0)) return;
  dnd.id = it.dataset.id;
  dnd.el = it;
  dnd.sx = dnd.lx = e.clientX;
  dnd.sy = dnd.ly = e.clientY;
  dnd.pt = e.pointerType;
  dnd.on = false;
  clearTimeout(dnd.timer);
  if (e.pointerType !== 'mouse')
    dnd.timer = setTimeout(() => {
      if (dnd.el && !dnd.on) dndStart(dnd.lx, dnd.ly);
    }, 300);
});
window.addEventListener('pointermove', e => {
  if (!dnd.el) return;
  dnd.lx = e.clientX;
  dnd.ly = e.clientY;
  if (dnd.on) {
    dndMove(e.clientX, e.clientY);
    return;
  }
  const mv = Math.hypot(e.clientX - dnd.sx, e.clientY - dnd.sy);
  if (dnd.pt === 'mouse') {
    if (mv > 6) dndStart(e.clientX, e.clientY);
  } else if (mv > 10) {
    clearTimeout(dnd.timer);
    dnd.el = null;
    dnd.id = null;
  }
});
window.addEventListener('pointerup', () => dndEnd(true));
window.addEventListener('pointercancel', () => dndEnd(false));
document.addEventListener(
  'touchmove',
  e => {
    if (dnd.on) e.preventDefault();
  },
  { passive: false }
);
viewEl.addEventListener('contextmenu', e => {

});
viewEl.addEventListener('dragstart', e => e.preventDefault());
viewEl.addEventListener('keydown', e => {

/* ================= bottle maths: sprays per ml, value, pace ================= */
/* Sprays per ml, most specific first: the number entered for this bottle, what Lux learned from
   corrections of the remaining amount, the default from Settings, or a default by bottle size
   (atomizers on big bottles give more per spray; see README). */
const sizeSpm = p => (p.type === 'Decant' || (+p.maxMl || 100) <= 30 ? 15 : (+p.maxMl || 100) <= 75 ? 12 : 10);
const rateOf = p =>
  +p.spm > 0 ? +p.spm : +p.spmAuto > 0 ? +p.spmAuto : +S.settings.spm > 0 ? +S.settings.spm : sizeSpm(p);
const rateSrc = p =>
  +p.spm > 0
    ? 'your number'
    : +p.spmAuto > 0
      ? 'learned from your corrections'
      : +S.settings.spm > 0
        ? 'your default'
        : 'by bottle size';
/* Correcting the remaining ml by hand tells Lux how much this atomizer really sprays. */
function learnRate(p, old) {
  const c = old.cal;
  p.cal = { ml: p.ml, sprays: p.sprays || 0 };
  if (!c) return;
  const n = (p.sprays || 0) - c.sprays,
    used = c.ml - p.ml;
  if (n >= 15 && used >= 1) p.spmAuto = Math.round(clamp(n / used, 4, 30) * 10) / 10;
}
const hasPrice = p => +p.price > 0 && +p.maxMl > 0;
const perMl = p => (hasPrice(p) ? +p.price / +p.maxMl : 0);
const valueLeft = p => (hasPrice(p) ? +p.price * clamp(p.ml / p.maxMl, 0, 1) : 0);
/* Symbols such as € or $ go first, letter codes such as kr or Kč after the number. */
function money(v, dec) {
  const c = cur(),
    n = dec ? (+v).toFixed(2) : fmt(v);
  return !c ? n : /^[^\sA-Za-z\u00C0-\u024F\u0400-\u04FF]{1,2}$/.test(c) ? c + n : n + '\u00a0' + c;
}
const fmtMl = v =>
  v >= 1000
    ? (v / 1000).toLocaleString(undefined, { maximumFractionDigits: 2 }) + ' l'
    : v < 10
      ? mlf(v) + ' ml'
      : fmt(v) + ' ml';
/* ml a day from your wears of this bottle (sprays, or the ml a wear took), over the last three months
   and, for bottles older than four months, the last year too. days is the middle estimate; lo and hi
   the range between the two paces, so seasonal scents do not look more precise than they are. */
function pace(p) {
  const now = Date.now(),
    age = Math.max(7, (now - (p.created || now)) / DAY),
    r = rateOf(p);
  const rate = d => {
    const span = Math.min(d, age),
      t0 = now - span * DAY;
    let ml = 0;
    S.wears.forEach(w => {
      if (w.pid === p.id && w.t >= t0) ml += w.ml != null ? +w.ml : w.n / r;
    });
    return ml / span;
  };
  // the year counts only when there are wears from before the last four months
  const old = age > 120 && S.wears.some(w => w.pid === p.id && w.t < now - 120 * DAY);
  const L = [rate(90)].concat(old ? [rate(365)] : []).filter(x => x > 0);
  if (!L.length) return { perDay: 0, days: null, lo: null, hi: null };
  const d = L.reduce((a, b) => a + b, 0) / L.length,
    days = p.ml / d;
  // the range stays within about a third either way of the middle estimate
  return { perDay: d, days, lo: Math.max(p.ml / Math.max(...L), days * 0.7), hi: Math.min(p.ml / Math.min(...L), days * 1.4) };
}
/* "Mar 2027" or "Mar – Jun 2027": when a bottle runs out at your pace */
function emptyRange(p) {
  const q = pace(p);
  if (q.days == null || q.days >= 3650) return '';
  const f = (d, y) =>
    new Date(Date.now() + d * DAY).toLocaleDateString(
      I18N.loc,
      y ? { month: 'short', year: 'numeric' } : { month: 'short' }
    );
  const a = new Date(Date.now() + q.lo * DAY),
    b = new Date(Date.now() + q.hi * DAY);
  if (a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth()) return f(q.days, 1);
  return (a.getFullYear() === b.getFullYear() ? f(q.lo, 0) : f(q.lo, 1)) + ' \u2013 ' + f(q.hi, 1);
}
/* What one wear costs: your usual sprays for this bottle times its price per ml (3 sprays until
   there are wears). Fair for bottles you had before Lux too. */
function wearCost(p) {
  const W = allWears().filter(w => w.pid === p.id),
    n = W.length,
    avg = n ? W.reduce((a, w) => a + (+w.n || 0), 0) / n : 3;
  return { n, avg, cost: (perMl(p) * avg) / rateOf(p) };
}
function leftText(days) {
  if (days == null) return '';
  if (days < 14)
    return 'about ' + Math.max(1, Math.round(days)) + (Math.round(days) === 1 ? ' day left' : ' days left');
  if (days < 70) return 'about ' + Math.round(days / 7) + ' weeks left';
  if (days < 730) return 'about ' + Math.round(days / 30) + ' months left';
  return 'years left at your pace';
}
const lowOf = p => !notOwn(p.shelf) && +p.maxMl > 0 && p.ml > 0 && p.ml / p.maxMl < 0.1;
const idleDays = p => {
  const lw = lastWorn(p.id);
  return Math.floor((Date.now() - (lw || p.created || Date.now())) / DAY);
};

/* ================= tests count as wears ================= */
/* Every Test lab test counts as a wear (Journal, calendar, streak, Stats, recaps, picks, share),
   also tests of wishlist bottles and tests typed by hand, old ones included. A test logged from a
   cabinet bottle already made a real wear at the same moment, so it is not counted twice.
   Test entries are read-only here; they are edited in the Test lab. */
function testWears() {
  const T = (S.tt && S.tt.sessions) || [];
  if (!T.length) return [];
  const real = new Set(S.wears.map(w => w.pid + '@' + w.t));
  return T.filter(x => !real.has(x.pid + '@' + x.t0)).map(x => {
    const p = x.pid && byId(x.pid);
    return {
      id: 't' + x.id,
      pid: p ? p.id : null,
      t: x.t0,
      n: +x.sprays || 0,
      test: true,
      name: p ? p.name : x.name,
      brand: p ? p.brand : x.brand || '',
      fam: p ? p.fam : x.fam || '',
      price: x.price,
      temp: x.weather && x.weather.temp != null ? x.weather.temp : null
    };
  });
}
function allWears() {
  return S.wears.concat(testWears());
}
/* The bottle behind a wear, or a stand-in for a tested fragrance that is on no shelf. */
function wP(w) {
  return (
    byId(w.pid) || {
      id: w.id,
      name: w.name || '?',
      brand: w.brand || '',
      fam: w.fam || '',
      maxMl: 100,
      ml: 100,
      shelf: 'wish'
    }
  );
}
function wKey(w) {
  return w.pid || 'n:' + norm((w.brand || '') + ' ' + w.name);
}
function wearMl(w) {
  const p = byId(w.pid);
  return w.n / (p ? rateOf(p) : 10);
}
/* Value of what was sprayed: the price paid for own bottles; for tests also the seen price of a
   wishlist bottle or the price noted in the test (per ml of the bottle size, 100 ml if unknown).
   None of this touches the collection value. */
function wearPerMl(w) {
  const p = byId(w.pid);
  if (p && !notOwn(p.shelf) && hasPrice(p)) return perMl(p);
  if (!w.test) return 0;
  const price = +w.price > 0 ? +w.price : p && +p.seen > 0 ? +p.seen : p && hasPrice(p) ? +p.price : 0;
  return price ? price / ((p && +p.maxMl) || 100) : 0;
}

/* Purchases: a bottle counts from the day it was bought (Bought on, or "I bought it" on the wishlist). */
const buys = () => owned().filter(p => +p.bought > 0);

function nbDays() {
  const nb = S.settings.nb;
  if (!nb || !nb.start) return 0;

/* Called after a save that may add a purchase: a purchase during a no-buy run ends that run. */
function nbCheck(lb0) {
  const nb = S.settings.nb,
    lb = lastBuy();
  if (!nb || !nb.start || lb <= lb0 || lb < nb.start) return;
  const run = Math.max(0, Math.floor((sod(lb) - sod(Math.max(nb.start, lb0))) / DAY));
  nb.best = Math.max(nb.best || 0, run);

  setTimeout(() => toast(`No-buy run ended after ${run} ${run === 1 ? 'day' : 'days'}. It starts again from today.`), 400);
}

/* Every note of every fragrance you rated (tests first, else the stars of a bottle) gets that score;

      o.s.push(sc);
      o.f.push(name);

  testedList().forEach(g => {
    const tags = T ? T.tagCounts(g).map(x => x[0]) : [];
    push(pyrAll(pyrOf(g.brand, g.name)).concat(tags), g.avg, g.name);

/* Before buying: which of your bottles are close, by shared notes (Jaccard) and the scent family. */
function similarOwned(b, n, fam, skipId) {
  const k = pkey(b, n),
    mine = new Set(pyrAll(pyrOf(b, n)).map(norm)),
    fk = famKind(fam || '');

    .filter(p => p.id !== skipId && pkey(p.brand, p.name) !== k)
    .map(p => {
      const o = [...new Set(pyrAll(pyrOf(p.brand, p.name)).map(norm))],
        sh = o.filter(x => mine.has(x));
      const uni = new Set([...mine, ...o]).size;
      let sc = uni ? sh.length / uni : 0;
      if (fam && p.fam && norm(p.fam) === norm(fam)) sc += 0.25;
      else if (fam && p.fam && fk !== 'mid' && famKind(p.fam) === fk) sc += 0.1;
      return { p, sc, sh: sh.map(capNote) };

/* Seven bottles for the week, the ones that waited longest, no more than two of one family.
   Kept for the whole week (S.settings.rot) so it does not reshuffle as you wear them. */
const weekStart = (t = Date.now()) => {
  const d = new Date(sod(t));
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getTime();
};
function rotation(fresh) {
  const wk = dkey(weekStart()),
    r = S.settings.rot;
  if (!fresh && r && r.wk === wk && r.ids.every(id => byId(id))) return r.ids;
  const skip = new Set(fresh && r ? r.ids : []),
    fam = {},
    ids = [];
  owned()
    .filter(p => p.ml > 0)
    .sort((a, b) => idleDays(b) - idleDays(a))
    .forEach(p => {
      if (ids.length >= 7 || skip.has(p.id)) return;
      const f = norm(p.fam) || '?';
      if ((fam[f] || 0) >= 2) return;
      fam[f] = (fam[f] || 0) + 1;
      ids.push(p.id);
    });
  if (ids.length < 7)
    owned()
      .filter(p => p.ml > 0 && !ids.includes(p.id))
      .sort((a, b) => idleDays(b) - idleDays(a))
      .forEach(p => {
        if (ids.length < 7) ids.push(p.id);

  S.settings.rot = { wk, ids };
  save();
  return ids;
}
